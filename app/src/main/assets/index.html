":["用匿名用户登录，登录成功才算真正连上","UserInfo.DefaultUser 是不带用户名密码的默认匿名用户。Logon 内部 lock(this) 后走 LogonOperation，会真的与控制器握手；控制器同一时刻只给一个用户 mastership，示教器或其他客户端占着时这里会抛异常。所以「连接成功」实质只是「登录成功」，能不能读位姿还要看后面的 GetPosition。"],"130":"","131":"开始用加号拼接多行成功提示；字符串里的反斜杠 n 会被 MessageBox 渲染成换行","132":"第一行：结论，末尾的反斜杠 n 换行，后面的加号表示还有下一段","133":"第二行：控制器名，取自名片，而不是登录后从控制器现查","134":"第三行：系统名，出问题时用来确认到底连的是哪个系统","135":"第四行：IP，最后一段不再接换行符","136":"","137":"返回成功，此时 controller 已就绪，Form1 可以开始定时读位姿","138":"闭合 try 块","139":"兜住建连 / 登录期间的所有异常","140":"catch 块的左括号","141":"同样只取外层 Message，丢了内层原因（与第 62 行一个毛病）","142":"","143":"失败时可能已经建出对象却没登录成功，得把它清理掉","144":"if 块的左括号","145":["显式销毁半成品对象，释放它持有的底层连接与事件订阅","不 Dispose 只置 null，对象要等 GC 才回收，而 PCSDK 的 Controller 持有非托管资源（SDKBase / Adapter 的 Dispose(bool) 链负责收），GC 收不到就等于把连接和登录态一直挂着。这是 IDisposable 类型的基本原则：能 Dispose 就别等 GC。"],"146":"再把字段置 null，让 CurrentController 回到未连接状态","147":"闭合 if 块","148":"","149":"失败返回；Form1.button2_Click 照样会把 message 弹出来","150":"闭合 catch 块","151":"闭合 ConnectControllerByIndex 方法","152":"","153":"注释：说明本方法负责清理连接","154":"返回 void：断开对调用方没有成功 / 失败可言，尽力而为即可","155":"方法体的左括号","156":"幂等判断：没连过就什么都不做，所以本方法被重复调用也不会炸","157":"if 块的左括号","158":"开始保护段：Logoff 要和控制器通信，控制器已关机或断网时会抛","159":"try 块的左括号","160":"先退出登录让出 mastership，再 Dispose 销毁对象，这个顺序不能反","161":"再销毁对象，释放底层连接与事件订阅；两行都成功才算正常路径","162":"闭合 try 块","163":"不带变量的空 catch：不关心异常内容，只要别让关窗时弹框","164":"catch 块的左括号","165":"原作者注释：说明这里的吞异常是有意为之","166":"闭合 catch 块","167":"finally 无论成败都会执行，是这里最关键的结构","168":"finally 块的左括号","169":["必须放在 finally：哪怕 Logoff 抛异常，状态也要回到未连接","如果这行写在 try 末尾，Logoff 一抛就跳过它，字段会留着一个已 Dispose 或半死的对象，CurrentController 就谎报「还连着」，AbbRobotPoseReader 拿它去 GetPosition 只会连环失败。空 catch 的取舍：关程序时再弹错误框只会烦人，代价是把失败信息彻底丢了——至少该 Debug.WriteLine 一行。"],"170":"闭合 finally 块","171":"闭合外层 if (controller != null) 块","172":"闭合 DisconnectController 方法","173":"","174":"闭合 AbbControllerConnection 类","175":"闭合 ABB_Digital_Twin 命名空间，文件到此结束"},"form":{"1":"引入 .NET 基础命名空间，`EventArgs` 这类类型都从这里来","2":"引入泛型集合命名空间，第 62 行的 `List<string>` 靠它","3":"引入组件模型命名空间，本文件没直接用到，是模板残留","4":"引入 ADO.NET 数据命名空间，本程序不碰数据库，纯属模板自带","5":"引入绘图命名空间（颜色、字体、坐标），Form1.cs 里没用，只有 Designer 用","6":"引入 LINQ 扩展方法，本文件没有查询表达式，属于没用上的 using","7":"引入文本处理命名空间，本文件不用 `StringBuilder`，也是模板自带","8":"引入任务并行库，本程序全同步、不用 async/await，这行是废的","9":"引入 WinForms 命名空间，`Form`、`MessageBox` 都住在这里","10":"","11":"","12":"把下面的类型装进 `ABB_Digital_Twin` 名字空间，和下两层同属一窝","13":"命名空间左括号，这里面的名字都归 `ABB_Digital_Twin` 管","14":["声明窗体类；`partial` 说明它只是这个类的一半","编译时编译器把本文件和 `Form1.Designer.cs` 里的另一个 `partial class Form1` 合成一个完整类：本文件写逻辑，Designer 写控件长什么样，两半私有成员互见——所以这里能直接写 `txtJ1.Text`。`: Form` 表示继承 WinForms 窗体基类，窗口边框、消息循环、`Controls` 集合全是白拿的。"],"15":"类体左括号，从这里到第 199 行都是 Form1 的成员","16":["设备层对象的字段；没写修饰符，类成员默认 `private`","这里是组合（has-a）而不是继承：Form1 完全不懂 ABB 的 RPC 协议，只把活派给 `AbbControllerConnection`，后者才持有真正的 `Controller` 对象。UI 层因此只承担调度职责，将来换底层实现时这一行是唯一的改动点。"],"17":"数据层对象的字段，负责把 Controller 里的读数摊平成 DTO","18":["WinForms 版定时器；它的 `Tick` 在 UI 线程上执行","特意写全名 `System.Windows.Forms.Timer`，是为了和另外两个同名类划清界限：`System.Threading.Timer` 的回调跑在线程池线程上，在里面改 `txtJ1.Text` 必抛跨线程访问异常；`System.Timers.Timer` 默认也在池线程。WinForms 版靠窗口消息 WM_TIMER 驱动，回调天然在 UI 线程，不需要 `Invoke`。"],"19":"构造函数，`new Form1()` 时最先执行，此时控件刚被创建","20":"构造函数体的左括号，里面的顺序就是初始化的顺序","21":"调设计器生成的方法，把按钮、文本框、菜单一次造出来并摆好位置","22":"注释：下面设置定时器的刷新周期","23":"注释：500 表示每 500 毫秒读一次，即每秒读 2 次","24":"注释：初期用 500，稳定后可以改 200","25":["把刷新间隔设为 500 毫秒，也就是每秒读 2 次","`Interval` 的单位是毫秒，含义是『两次 Tick 之间至少隔多久』的精度上限，不是精确周期：单次读取耗时超过 500ms 时实际周期就被拉长。ABB 现场（尤其 RobotStudio 的虚拟控制器或跨网段）单次 `GetPosition` 可能有几十毫秒往返，所以注释里建议先 500 再降到 200 是有依据的。"],"26":"","27":"注释：下面把定时器事件挂到处理方法上","28":"注释：每次到点就自动执行 `PoseTimer_Tick`","29":"用 `+=` 把处理方法挂到 `Tick` 事件上——委托机制，只是登记不执行","30":"","31":"注释：关闭窗口时停表并断开控制器","32":["订阅窗体关闭事件，本意是关窗时收拾现场","坑：`Form1.Designer.cs` 第 367 行也写了同样的订阅，而 `InitializeComponent()` 在本方法第一行就跑过了，于是处理方法被挂了两次、关闭时连跑两遍。没爆是因为它幂等：`poseTimer.Stop()` 重复无害，`DisconnectController()` 第一次跑完就把 `controller` 置 null，第二次直接跳过。"],"33":"构造函数体右括号；控件齐了、定时器接好了，但还没启动","34":"XML 注释：说明下面是定时器触发的事件处理","35":"XML 注释续：只要 `poseTimer.Start()` 启动了定时器","36":"XML 注释续：这个方法就按 `Interval` 毫秒反复执行","37":"XML 注释续，补一句说明这是自动执行的","38":"XML 注释块结束，下面才是真正的方法声明","39":"Tick 的标准签名：`sender` 是定时器本身，`e` 是空的事件参数","40":"方法体左括号，Tick 的全部逻辑从这里开始","41":"注释：这一行就是『定时读取机器人姿态』","42":["调核心方法读一次姿态；传 `false` 表示这里先不弹窗","传 `false` 的用意：让 `UpdateRobotPoseDisplay` 只回答成不成、不自作主张弹框，由本方法统一决定怎么提示。代价是 `poseReader` 给出的那句具体原因（比如『请先连接 ABB 控制器』）被丢掉了，用户只看到第 50 行那句笼统提示，排障时信息更少。"],"43":"","44":"注释：失败可能是控制器断开、未连接、RobotStudio 已关闭","45":"读取失败就进这个分支，成功则什么都不做","46":"if 体的左括号，失败处理都在里面","47":"注释：先停表，免得每 500ms 重复报一次错","48":"先 `poseTimer.Stop()` 掐掉轮询，这样后面弹框期间不会再来一次读取","49":"","50":["在 Tick 里弹模态对话框报错——典型的『用弹窗做错误通道』","`MessageBox.Show` 是模态的，它自己跑一个消息循环，把主窗口冻结到用户点确定为止；现场无人在电脑前时，程序就一直停在这一个框上，读数不再更新、界面动不了，而且这个框没有自动重连或重试的出口。想恢复只能手动点『开始实时读取』——如果控制器还是断的，就再弹一次。好在第 48 行已经先 Stop，不会自己叠出第二层框。正确的错误通道是状态栏文字或日志，只在用户主动点击时才弹框。"],"51":"if 体右括号，失败处理到此结束","52":"`PoseTimer_Tick` 方法体右括号","53":"","54":"『扫描控制器』按钮的处理方法，Designer 第 76 行接线","55":"扫描按钮处理方法体的左括号","56":"先清空列表，免得上次扫描的结果和这次的混在一起","57":"","58":"声明一个字符串变量，稍后当 `out` 实参接住下层给的提示文字","59":"","60":["调设备层扫描控制器，`out message` 带回结果文字","`ScanControllers` 内部是 `new NetworkScanner()` 加 `scanner.Scan()`，走局域网广播发现，同步阻塞，通常要数秒。它跑在 UI 线程上，所以这几秒里窗口完全不重绘、按钮也点不动，这就是『界面假死』。正规写法是 `Task.Run` 加 `async/await`，扫完再回 UI 线程填列表。"],"61":"","62":"无论成败都先把扫描结果取成一组要显示的文本行","63":"","64":"逐行遍历这组文本，一行显示成一个列表条目","65":"foreach 体左括号","66":"一行塞进 ListBox；`Items` 是对象集合，字符串直接当条目","67":"foreach 体右括号","68":"","69":"只有扫描失败才进这个分支","70":"if 体左括号，弹框动作在里面","71":"弹出下层给的失败原因，比如『扫描失败：……』","72":"if 体右括号，扫描流程收尾","73":"`button1_Click` 方法体右括号","74":"","75":"『连接控制器』按钮的处理方法，Designer 第 99 行接线","76":"连接按钮处理方法体的左括号","77":"为 `out` 实参准备的变量；这一行不赋值，编译器也不抱怨","78":"","79":"列表里一台控制器都没有（没扫过，或上次一台没扫到）","80":"if 体左括号，里面先补扫再连接","81":"那就先自动扫一次，省得用户还得回头点『扫描』","82":"","83":"补扫也失败，说明网络里真没找到控制柜","84":"if 体左括号，扫描失败的处理","85":"把补扫失败的原因弹给用户看","86":"立刻返回，不再往下走连接逻辑","87":"if 体右括号，补扫流程结束","88":"外层 if 体右括号","89":"","90":["连接控制器——固定连第 0 台，完全无视用户选中了哪一台","`ConnectFirstController()` 内部就是 `ConnectControllerByIndex(0, ...)`，`listBox1.SelectedIndex` 一次没被读过，所以选中第 2 台再点连接，连上的仍是第 1 台。Connection 里已有按序号连接的方法，把实参换成 `SelectedIndex` 就能修好。"],"91":"","92":"不管成功还是失败都弹框：成功弹一大段控制器信息，失败弹原因","93":"`button2_Click` 方法体右括号","94":"","95":"窗体关闭事件的处理方法（前面说过，它被订阅了两次）","96":"关闭处理方法体的左括号","97":"注释：关窗之前先停表","98":"注释：免得正在关程序时 Timer 还在读机器人数据","99":"先停轮询，断掉 500ms 的读，免得 Dispose 中途再发起 SDK 调用","100":"","101":"注释：断开连接、释放资源","102":"再 `Logoff` + `Dispose` 掉 Controller，自带兜底","103":"`Form1_FormClosing` 方法体右括号","104":"","105":"『读取六轴姿态』按钮的处理方法，Designer 第 111 行接线","106":"读取按钮处理方法体的左括号","107":"单次读取；传 `true`，失败时就会直接弹框把原因告诉用户","108":"`button3_Click` 方法体右括号","109":"XML 注释：说明本方法读六轴并写进 `txtJ1`~`txtJ6`","110":"XML 注释续：一句话说明这个方法干什么","111":"XML 注释块结束，参数说明开始","112":"XML 注释：参数 `showErrorMessage` 的含义","113":"XML 注释续：是否显示错误弹窗","114":"XML 注释续：手动点按钮时可以显示错误","115":"XML 注释续：Timer 刷新时也建议弹一次再停表","116":"XML 注释续，讲清楚什么时候该弹窗","117":"XML 注释块结束，下面是返回值说明","118":"XML 注释续：true 表示读取成功，false 表示失败","119":"XML 注释块结束，方法签名在下一行","120":"核心方法签名：收一个『要不要弹错误框』的开关，返回读取成败","121":"核心方法体的左括号，全部逻辑都在这一块里","122":"注释：用来装读到的姿态数据","123":["只声明不赋值——因为它接下来要当 `out` 实参","C# 语言保证：只要被调方正常返回，就一定给 `out` 参数赋过值，所以这里不初始化也不报『使用了未赋值的变量』。真赋值在 Reader 第 16 行（置 null）和第 43 行（new DTO）；万一走异常分支，`poseData` 会是 null，但那时 `readOk` 为 false，第 149 行不会执行，不会空引用。"],"124":"","125":"注释：用来装提示文字","126":"同上，只声明；值由 `out` 参数带回来","127":"","128":"注释：调数据层，从当前连接的控制器读 J1~J6","129":["把设备层拿到的 Controller 喂给数据层，两个 `out` 参数带回数据与提示","这一行是两个分层的接缝：`abbService.CurrentController` 是 Connection 对外暴露的唯一 ABB 对象，`ReadRobotPose(...)` 只要一个 `Controller` 就能干活，于是『怎么连』和『怎么读』彻底解耦。未连接时为 null，Reader 第 21 行判空并回『请先连接 ABB 控制器』。"],"130":"第一个实参：当前的 Controller 对象，未连接时为 null","131":"`out poseData`：被调方 new 一个 DTO 塞回来","132":"`out message`：失败时这里装着给人看的中文原因","133":"多行调用的收尾右括号加行末分号","134":"","135":"注释：下面是读取失败的分支","136":"读失败就进这个分支，成功则跳过去","137":"if 体左括号，失败处理开始","138":"注释：只有允许弹窗的时候才弹","139":"开关为 `true` 时才弹——『显示策略』和『读取逻辑』分开的唯一体现","140":"if 体左括号，真正弹框的语句","141":"弹出下层给的具体原因","142":"内层 if 体右括号","143":"","144":"返回 false，告诉调用方这次没读到","145":"外层 if 体右括号","146":"","147":"注释：把读到的六轴角度写进 TextBox","148":"注释：`F2` 表示保留两位小数","149":["把 J1 格式化成两位小数写进文本框，其余五轴一模一样","`ToString(\"F2\")` 是定点格式：小数点后固定两位、整数部分不限，所以 1234.5 会写成 `1234.50`——它**不是**『两位有效数字』（那是 `G2`）。小数点符号跟着当前 `CultureInfo` 走，某些区域设置下写成 `1234,50`，导出或再解析时要留意。`J1` 源头是 `RobJoint` 的 `float`，精度上限仍是约 7 位有效数字。"],"150":"J2 落屏，格式和上一行完全一致","151":"J3 落屏，和前两行同一个模板","152":"J4 落屏，格式保证一致","153":"J5 落屏，倒数第二个轴","154":["J6 落屏——界面显示通道到此为止","DTO 里其实有 14 个字段：`TcpX/TcpY/TcpZ`（mm）、`Q1~Q4`（Q1 是标量 w，顺序和 `System.Numerics.Quaternion` 相反）和 `MechanicalUnitName` 都赋了值却没人读。想让 TCP 上屏，在下面加三行 `poseData.TcpX.ToString(...)` 再在 Designer 补三个 TextBox。"],"155":"","156":"读到了也写完了，返回 true","157":"`UpdateRobotPoseDisplay` 方法体右括号","158":"","159":"窗体 `Load` 事件的处理方法，Designer 第 368 行还挂着它","160":"Load 处理方法体的左括号","161":"","162":"方法体右括号——空的：既不读数据也不初始化，挂着却没内容的残留","163":"","164":"『开始实时读取』按钮的处理方法，Designer 第 273 行接线","165":"开始按钮处理方法体的左括号","166":"注释：启动轮询之前先试读一次","167":"注释：第一次都读不到，就不要启动定时器","168":"先手动读一次并允许弹窗——这个顺序是对的：连不上就别启动轮询","169":"","170":"第一次试读就没读到，直接退出","171":"if 体左括号，失败就返回","172":"直接返回，定时器保持停着","173":"if 体右括号，成功才继续往下","174":"","175":"注释：下面启动定时器","176":"注释：启动后 Tick 会按设定间隔自动执行","177":"真正启动轮询；此后每 500ms 读一次","178":"","179":"再弹一句『已开始实时读取』——此时定时器其实已经在跑了","180":"`btnStartRealTime_Click` 方法体右括号","181":"","182":"『停止实时读取』按钮的处理方法，Designer 第 285 行接线","183":"停止按钮处理方法体的左括号","184":"注释：停表就是停止轮询","185":"停表；本来就在停的状态再停一次也无害","186":"","187":"弹一句已停止，纯提示；界面上的旧读数不会清空","188":"`btnStopRealTime_Click` 方法体右括号","189":"","190":"残留方法 `toolStripLabel1_Click`；Designer 里已无此控件","191":"孤儿方法体的左括号，里面什么都没有","192":"","193":"方法体右括号——空壳，且没有任何控件引用它，纯死代码","194":"","195":"菜单项『12231』的点击处理方法，Designer 第 323 行接线","196":"菜单处理方法体的左括号","197":"","198":"方法体右括号——点开菜单再点子项，什么都不会发生，调试残留","199":"类体右括号，闭合 `partial class Form1`","200":"命名空间右括号，闭合 `ABB_Digital_Twin`"},"designer":{"1":"命名空间声明开头，本项目的窗体代码都归 ABB_Digital_Twin 管","2":"命名空间左括号，Form1 的两半都在这个块里面","3":["声明 Form1 的其中一半，partial 表示这个类还有另一半","另一半在同目录的 Form1.cs 里，那边写着 : Form 继承基类。partial 的两半合起来才是一个完整类，基类只需在任意一处声明；设计师把这处留给手写那半，避免两处都写、改一处漏一处导致编译错误。"],"4":"类体左括号，下面依次是字段、Dispose 和 InitializeComponent","5":"三斜线注释开头，这种注释会被 IDE 收进字段的提示气泡里","6":"注释正文：说明下面这个字段是设计器自己必需、要用到的变量","7":"summary 注释的收尾标签","8":["声明 IComponent 容器字段并置 null，这是设计师的统一释放登记处","components 是硬约定名，改名会连带 this.components 的那些构造调用全崩。初值 null 表示还没建，等 InitializeComponent 第 31 行 new 出来才有值；Dispose 里先判空再释放，就是为了两种时序都不出错。"],"9":"","10":"给下面的 Dispose 方法写文档注释：清理所有正在使用的资源","11":"注释正文，一句话说明这个方法负责释放窗体持有的资源","12":"summary 注释的收尾标签，下面一行才是参数说明","13":"参数注释：disposing 为 true 释放托管资源，false 只处理非托管","14":"重写基类的 Dispose(bool)，这是 .NET 约定好的资源释放入口","15":"Dispose 方法体的左括号，真正的释放逻辑在下面几行","16":["两个条件同时成立才动手释放：disposing 为真，且组件容器存在","disposing=false 是终结器（GC）那条路径，那时碰托管对象会出问题；components!=null 防的是窗体根本没建成。顺序也固定：先释放自己的组件，再交回基类。"],"17":"if 块的左括号，两个条件都为真才进得来","18":"调用组件容器的 Dispose，把登记过的组件一次全清掉","19":"闭合 if 块，下一行的 base.Dispose 属于方法级","20":"把释放交回基类，这一句漏了控件句柄就不会真正销毁","21":"闭合 Dispose 方法","22":"","23":"#region 折叠标记，把这一大段设计器代码折成一栏便于阅读","24":"","25":"三斜线注释开头，声明 InitializeComponent 是设计器支持必需的","26":"注释正文：提醒不要用代码编辑器手改这个方法体","27":"注释补充：要改界面请回到窗体设计器里拖控件","28":"summary 注释的收尾标签","29":"声明 InitializeComponent，无参无返回，窗体构造时被调一次","30":"方法体左括号，30 个控件的创建、配置、接线全在这里","31":["先创建组件容器实例，赋给 components 字段——统一释放的登记处","IContainer 是 .NET 的组件容器接口，任何 IComponent（右键菜单、Timer 之类）都可以登记进去，像下面三行那样在构造时传入 this.components。窗体释放时只调一次 components.Dispose()，登记过的组件全被顺带带走，不必逐个写 Dispose。"],"32":["创建 ComponentResourceManager，负责按名字从 .resx 资源里取对象","本任务范围（1~208 行）内它一次都没被用到，真正的用途在文件末尾给窗体设图标那句 resources.GetObject(\"$this.Icon\")。设计师照模板总会生成这一行，手删掉会让那句编译不过；它本身不是可释放组件，所以不进 components。"],"33":"new 出「扫描控制器」按钮，此刻还是内存里的空壳","34":"new 出显示控制器列表的 ListBox","35":"new 出「连接控制器」按钮","36":"new 出「读取六轴姿态」按钮","37":"new 出显示「J1 :」的标签","38":"new 出放 J1 数值的文本框","39":"new 出放 J2 数值的文本框","40":"new 出显示「J2 :」的标签","41":"new 出 txtJ4，排在 txtJ3 前面，只反映拖控件的先后","42":"new 出显示「J4 :」的标签","43":"new 出放 J3 数值的文本框","44":"new 出显示「J3 :」的标签","45":"new 出放 J6 数值的文本框","46":"new 出显示「J6 :」的标签","47":"new 出放 J5 数值的文本框","48":"new 出显示「J5 :」的标签","49":"new 出 J1 行末尾的「度」单位标签，字段名 label7","50":"new 出 J2 行的「度」标签 label8","51":"new 出 J3 行的「度」标签 label9","52":"new 出 J4 行的「度」标签 label10","53":"new 出 J5 行的「度」标签 label11","54":"new 出 J6 行的「度」标签 label12","55":"new 出「开始实时读取」按钮，背后配一个 500ms 定时器","56":"new 出「停止实时读取」按钮，成对地管住那个定时器","57":"new 出右键菜单 contextMenuStrip1，登记进 components","58":"new 出右键菜单 contextMenuStrip2，同样登记进 components","59":"new 出右键菜单 contextMenuStrip3，同样登记进 components","60":"new 出顶部菜单条 MenuStrip","61":"new 出菜单条上的那一项，文本是 12231，调试时的占位","62":"new 出它的下拉子项，文本 12121，同样是占位","63":["先冻结 menuStrip2 的布局，紧接着冻结整个窗体","SuspendLayout 是布局开关：冻结期间设 Location/Size 只改字段，不触发重排重绘。顺序上先子后父，恢复时正好反过来。配对的是文件末尾的 ResumeLayout(false)+PerformLayout()，冻结几次就要恢复几次，少恢复一次界面就永远排不出正确布局。"],"64":"冻结窗体自身的布局，此后改坐标不会立刻触发重排和重绘","65":"段首分隔注释，紧跟着的下一行就是 button1 的名字","66":"段名注释，写的就是这个控件在设计师里的名字","67":"分隔注释的收尾行，空的 // 只是视觉分隔","68":["给按钮设字体：微软雅黑 9 点、常规、按 Point 计量、字符集 134","第 5 个参数 134 是 GDI 的字符集编号，0x86 对应的正是简体中文 GB2312；写成 0 或 128 系统就按别的字符集解析，中文可能变方块或乱码。9F 的 F 是 float 后缀，写成 9 会当 double 传，编译不过。"],"69":["Location 是控件左上角相对父容器（窗体）左上角的像素坐标，这里是 (12,219)","y=219 而右侧 button2 的 y=216，两个本该齐平的按钮差了 3 像素，肉眼能看出歪；x=12 也与下面那行 Margin 无关——Margin 影响设计器的对齐吸附与 AutoSize 换算，对写死 Location 的控件运行时不再加白边。"],"70":"外间距 3,4,3,4，是设计师按字体缩放算出来的对齐余量","71":"Name 设为 button1，它就是运行时 this.button1 那个字段的来源","72":"尺寸 165×52，比默认按钮高得多，是方便点按的大按钮","73":"TabIndex 0，按 Tab 键时它是第一个获得焦点的控件","74":"按钮上显示的文字「扫描控制器」","75":"背景跟随系统视觉样式，按钮是系统主题的渐变而非死板纯色","76":["把 Click 事件接到 Form1.cs 的 button1_Click，事件接线就写在这里","+= 是「订阅」：一个事件可以挂多个处理者，点一下全部依次执行，想摘掉用 -=。new System.EventHandler 是把方法包成委托对象的标准写法，方法签名必须是 void(object, EventArgs)。这就是「点按钮会跑哪个方法」的唯一依据。"],"77":"分隔注释，下面这一段讲的是 listBox1","78":"段名注释，ListBox 在设计师里的名字","79":"分隔注释的收尾行，纯 // 没有内容","80":"字体与按钮一致：微软雅黑 9 点、字符集 134 简体中文","81":["FormattingEnabled 置 true，启用 ListBox 的显示格式化","开启后每一项都先用 TypeConverter 转成显示文本再画，等于每次刷新多走一遍字符串格式化；只装字符串时可忽略，若装自定义对象想显示友好文本，就得靠它或重写 ToString。"],"82":["ItemHeight=20：每一项占 20 像素高，配 9 点微软雅黑的行高","它与字体大小是脱钩的两个数，字体调大而这里不改，文字会被裁。Size 给的 124 也不是 20 的整数倍，ListBox 默认 IntegralHeight=true 会尽量只显示整项，实际高度可能被吸附成 120（未验证实际吸附值）。"],"83":"左上角 (12,84)，贴着窗体左边，在下方按 Joint）里；外轴单元时 .RobAx 是空的。"},{"file":"reader","line":41,"title":"mechUnit.GetPosition(CoordinateSystemType.World) 读 TCP 位姿","desc":"只对 TCP Robot 型单元有效；它和关节角读取在同一个 try 里，它抛异常会把整次读取判失败。"},{"file":"pose","line":11,"title":"摊平成 DTO 的 14 个字段","desc":"把 PCSDK 的嵌套结构抄进 AbbRobotPoseData，界面层从此不需要认识 PCSDK 类型。"},{"file":"form","line":149,"title":"只把 J1~J6 写进 6 个 TextBox","desc":"TCP 的 X/Y/Z 和四元数 Q1~Q4 已经被读出来了，但一行都没显示 —— 这是「数字孪生」最该补的地方。"}],"conclusions":[{"t":"程序性质：姿态轮询监视器，不是数字孪生。没有 3D、没有反向控制、没有仿真联动。","file":"form","line":149},{"t":"DTO 里 14 个字段只用了 6 个：TCP 三轴、四元数四个、机械单元名，全是有赋值、没人读的死字段。","file":"pose","line":18},{"t":"只读 ActiveMechanicalUnit（当前激活的那一个）。PCSDK 的 MotionSystem.MechanicalUnits 能取全部单元，代码没写。","file":"reader","line":28},{"t":"GetPosition(CoordinateSystemType) 只支持 TCP Robot 型单元；当前单元若是变位机/外轴，该调用抛异常，关节角明明能读也一起失败。","file":"reader","line":41},{"t":"更隐蔽的一条：外轴单元时 GetPosition() 把关节角塞进 ExtAx，RobAx 是 RobJoint.Empty，于是 J1~J6 静默显示 0.00 而程序说「读取成功」。","file":"reader","line":38},{"t":"所有网络调用都在 UI 线程：扫描（广播，数秒）和 GetPosition（同步往返）直接从事件处理函数里调 → 期间窗体「未响应」。","file":"form","line":60},{"t":"永远只连第 0 台：button2_Click 固定调 ConnectFirstController()，完全忽略 listBox1 的选择，哪怕当选中的是第 2 台。","file":"form","line":90},{"t":"跨网段不可用：只做子网广播，没有手工 IP 输入。PCSDK 有 NetworkScanner.AddRemoteController(string)，代码没调用。","file":"conn","line":39},{"t":"异常处理丢诊断：三个 catch 都只取 ex.Message，没有异常类型、没有 InnerException、没有日志文件。","file":"reader","line":68},{"t":"FormClosing 被订阅两次（Designer.cs 第 367 行 + Form1.cs 第 32 行），因为处理幂等所以无害，但属冗余。","file":"designer","line":367},{"t":"位元隐患：csproj 里 Debug 是 PlatformTarget=x86，Release 是 AnyCPU —— Debug 验过能跑，不保证 Release 能跑。","file":"form","line":129}],"notes":["阅读建议：先看「概念」页建立直觉 → 回「逐行」从 Program.cs 往下读（只有 22 行）→ 重点啃 AbbRobotPoseReader.cs 那 74 行（整个程序的实质都在里面）→ 最后看「问题」页。","界面上的 6 个 TextBox 就是全部输出。想知道「程序到底显示了什么」，看 Form1.cs 第 149~154 行就够了。","本讲解器的源码是从原 zip 里逐字节抽出来的，行号与原始工程完全一致，可以直接对着工程看。","设计器代码（Form1.Designer.cs，409 行）是设计师自动生成的，逐行读完一遍即可，不必记住；真正要改布局时再看。"]},"concepts":[{"title":"① DTO 与三层：为什么要把数据「抄一遍」","paras":["DTO（Data Transfer Object）就是「只装数据、不带逻辑」的类。这里的 AbbRobotPoseData 有 14 个自动属性，没有任何方法。","为什么要多这一层？因为 PCSDK 返回的是 JointTarget / RobTarget 这种嵌套结构（struct 套 struct）。界面层若直接持有它们，就要求界面读懂 PCSDK；抄进 DTO 之后，界面只认识 AbbRobotPoseData —— 换成别的机器人品牌，只要换掉 Reader，界面一行不用改。","代价是「抄」的时候容易漏：本程序抄了 TCP 和四元数，却没在界面上显示，白抄。"],"example":"AbbRobotPoseData.cs:11  public double J1 { get; set; }","file":"pose","line":9,"label":"DTO 定义"},{"title":"② struct 与 class：RobJoint、Pos 是值类型","paras":["PCSDK 里 RobJoint、Pos、Orient、JointTarget、RobTarget 都是 struct（值类型）。赋值时是整块拷贝，不是共享引用。","所以 poseData.J1 = robJoint.Rax_1 只是把一个 float 拷进 double；robJoint 自己留在栈上，方法返回就没了 —— 这就是为什么必须在方法里「当场抄完」。","反过来说，Controller、NetworkScanner、ControllerInfo 是 class（引用类型），要小心生命周期：用完了要 Dispose，否则网络连接和事件订阅会留着。"],"example":"public struct RobJoint { private float _rax_1; ... }","file":"reader","line":38,"label":"robJoint 取值"},{"title":"③ 事件与委托：按钮怎么会「知道」调哪个方法","paras":["WinForms 的按钮有一个 Click 事件，类型是 EventHandler（本质是「能存方法引用的变量」）。","设计器里写 this.button1.Click += new System.EventHandler(this.button1_Click); 就是把方法挂到这个事件上。一个事件可以挂多个处理者（+= 可以写多次），触发时按挂的顺序全部执行。","这也解释了 FormClosing 那个小坑：Form1.cs 构造函数和设计器各挂了一次同一个方法，于是关闭窗口时它跑两遍。"],"example":"this.button1.Click += new System.EventHandler(this.button1_Click);","file":"designer","line":76,"label":"Click 接线"},{"title":"④ 两种 Timer：为什么这里必须用 WinForms 的","paras":["System.Windows.Forms.Timer 的 Tick 在 UI 线程上跑，可以直接改 TextBox.Text；代价是 Tick 里干重活会把界面卡住。","System.Threading.Timer / System.Timers.Timer 的回调在线程池线程上跑，直接碰控件会抛「线程间操作无效」的跨线程异常。","本程序用了 WinForms 的 Timer（安全），但 Tick 里调用的 GetPosition 是同步网络往返，于是每 500ms 界面就有一次小停顿；网络慢时会明显卡顿。正确的是任务型写法：Task.Run 读数据 + Invoke 回 UI。"],"example":"poseTimer.Tick += PoseTimer_Tick;   // 同一个 UI 线程","file":"form","line":29,"label":"Tick 订阅"},{"title":"⑤ 同步阻塞 = 界面假死","paras":["WinForms 的界面刷新、按钮响应、窗口拖动，全靠主线程的消息循环。主线程一旦在某个函数里等网络，消息就没人处理，窗口变白、标题栏「未响应」。","本程序里有两个典型的阻塞点：NetworkScanner.Scan()（广播发现，数秒）和每次 GetPosition()（一次控制器往返）。两者都从事件处理函数直接调用。","所以点了「扫描控制器」之后，你会看到窗口卡住几秒才有结果 —— 这不是死机，是设计问题。"],"example":"scanner.Scan();   // 同步广播，几秒","file":"conn","line":42,"label":"扫描阻塞"},{"title":"⑥ 四元数：Q1 是标量，不是 x","paras":["ABB 的姿态用单位四元数表示，四个分量 Q1~Q4。ABB 的约定是 Q1 = 标量部分 w，Q2/Q3/Q4 = 向量部分 x/y/z（在 PCSDK 里由 Orient.FillFromEulerAngles 把 u0→Q1、u1→Q2…映射，可反编译核实）。",".NET 的 System.Numerics.Quaternion 构造函数顺序是 (x, y, z, w)，直接 new Quaternion(Q1,Q2,Q3,Q4) 会得到错误姿态 —— 这是移植时最常见的错。","另外 PCSDK 的 Orient 自带 ToEulerAngles(out x, out y, out z) 和 FillFromEulerAngles(x,y,z)，要显示欧拉角根本不用自己推公式。"],"example":"robTarget.Rot.Q1..Q4 ；Orient.ToEulerAngles(out x,out y,out z)","file":"reader","line":58,"label":"Q1~Q4 赋值"},{"title":"⑦ 坐标系：World / Base / Tool / WorkObject","paras":["同一个 TCP 位置，在不同参考系下数字完全不同。PCSDK 的 CoordinateSystemType 让你选参考系：World（大地坐标）、Base（机器人基座）、Tool（工具坐标）、WorkObject（工件坐标）等。","本程序固定用 World，所以拿到的 X/Y/Z 是「相对机器人基座世界系」的毫米值。","注意 GetPosition(CoordinateSystemType) 这个重载只支持 TCP Robot 型机械单元；外轴/变位机要用无参的 GetPosition() 取关节值或另行处理 ExtAx。"],"example":"mechUnit.GetPosition(CoordinateSystemType.World)","file":"reader","line":41,"label":"World 位姿"}],"issues":[{"sev":"FATAL","title":"Debug 与 Release 的位元不一致：Release 可能一运行就崩","detail":"csproj 里 Debug 配置是 PlatformTarget=x86，Release 配置却是 AnyCPU。PCSDK 的三个 DLL 是 32 位原生程序集，AnyCPU 在有 64 位系统的机器上会以 64 位进程启动，加载 32 位 DLL 时抛 BadImageFormatException（「试图加载格式不正确的程序」）。于是「Debug 里验过能跑」完全不能证明「Release 能跑」。","fix":"把 Release 配置的 PlatformTarget 也改成 x86，两个配置统一；顺手把 Prefer32Bit 一并显式设上。","loc":[]},{"sev":"FATAL","title":"安装工程是 VS 模板残留，装出来路径是「厂商为 QQ 邮箱」的目录","detail":"Setup1.vdproj 里 ProductName = \"Setup1\"、Manufacturer = \"1571024199@qq.com\"。安装时的默认目录因此变成 [ProgramFiles]\\1571024199@qq.com\\Setup1；依赖收集还把几十个 System.*.dll（.NET Standard facade）卷进了安装包。交付给别人装会很难看，也容易和已有文件冲突。","fix":"改 ProductName / Manufacturer / ManufacturerUrl，清掉误收的 System.*.dll 依赖，只留 PCSDK 三个 DLL 与本程序 exe。VS2022 默认不支持 .vdproj，需要装 Microsoft Visual Studio Installer Projects 扩展。","loc":[]},{"sev":"BAD","title":"网络调用全在 UI 线程：扫描和轮询期间窗口「未响应」","detail":"NetworkScanner.Scan()（局域网广播发现，通常数秒）和 mechUnit.GetPosition()（一次控制器往返）都由按钮事件或 Timer.Tick 直接调用，而它们跑在 UI 线程上。Windows 的消息循环被阻塞，窗口就变白、标题栏出现「未响应」，用户会以为程序死了。","fix":"把耗时段放进 Task.Run，再 Invoke 回 UI 更新控件；或者改成 PCSDK 的订阅式接口（事件回调 + 自己切回 UI 线程）。扫描/连接期间还要禁用按钮，避免重复点击。","loc":[["form",60],["conn",42],["form",129]]},{"sev":"BAD","title":"永远只连第 0 台控制器，列表选择形同虚设","detail":"button2_Click 固定调用 ConnectFirstController()，内部写死 ConnectControllerByIndex(0)。listBox1.SelectedIndex 从头到尾没被读过 —— 界面上让你选，程序根本不看。更糟的是列表里每台控制器占 7 行（含一个空行），SelectedIndex 本来也不能直接当控制器序号用（要除以 7）。","fix":"现成方法 ConnectControllerByIndex 已经在，只要改成 ConnectControllerByIndex(listBox1.SelectedIndex / 7, out message) 即可；更好的是把列表换成 ListView 或 DataGridView，一台一行，选中即映射。","loc":[["form",90],["form",62],["conn",98],["conn",104]]},{"sev":"BAD","title":"GetPosition(CoordinateSystemType) 只支持 TCP Robot 型单元，抛异常会连累关节角","detail":"PCSDK 文档写明该重载「Supports mechanical unit type TCP Robot only」。当前激活单元若是变位机/外轴（MultiAxes / SingleAxis），这一步会抛异常；而它和关节角读取写在同一个 try 里，catch 一兜，整次读取就被判失败，界面上关节角明明已经读到了也不显示。","fix":"先判断 mechUnit.Type == MechanicalUnitType.TcpRobot 再调世界坐标位姿；或把两次 GetPosition 分别放进各自的 try，让关节角和 TCP 位姿互不影响。","loc":[["reader",41],["reader",66]]},{"sev":"BAD","title":"更隐蔽的一条：外轴单元时 J1~J6 静默显示 0.00，程序还说「成功」","detail":"PCSDK 的 MechanicalUnit.GetPosition()（无参）在单元不是 TCP Robot 时，把关节值放进 JointTarget.ExtAx，而 RobAx 是 RobJoint.Empty（全 0）。本程序只取 jointTarget.RobAx，于是六轴全是 0，但 message 依然是「读取机器人姿态成功。」、readOk 依然是 true —— 使用者看到一排 0.00，会以为机器人在原点。","fix":"读之前判单元类型；外轴场景改读 jointTarget.ExtAx（ExtJoint 的 Eax_a..Eax_f），并按类型决定显示哪些轴。","loc":[["reader",37],["reader",38],["reader",58]]},{"sev":"BAD","title":"TCP 位姿和四元数读了却从不显示：14 个字段只用 6 个","detail":"Reader 把 TcpX/TcpY/TcpZ、Q1~Q4、MechanicalUnitName 都算好了，Form1 只写 J1~J6 六个 TextBox。数字孪生最需要的末端位置（mm）和姿态，读出来就扔了。","fix":"在 Form1.UpdateRobotPoseDisplay 里补 3 个 TextBox 显示 TcpX/Y/Z（F2，单位 mm）；姿态用 robTarget.Rot.ToEulerAngles(out x, out y, out z) 转成欧拉角再显示（PCSDK 自带，不用自己推公式）。","loc":[["form",149],["pose",18],["pose",22]]},{"sev":"BAD","title":"异常处理丢诊断信息：只取 ex.Message","detail":"三处 catch 全部写成 message = \"…失败：\" + ex.Message。没有异常类型、没有 InnerException、没有堆栈、没有日志文件。而 PCSDK 内部会把底层 RPC 异常再包一层，真正的 HResult 与原因藏在 InnerException 里 —— 用户只会看到一句没头没脑的英文。现场排障基本没法做。","fix":"至少拼上 ex.GetType().Name 和 ex.InnerException?.Message，并把完整 ToString() 追加写进 %LOCALAPPDATA%\\ABB_Digital_Twin\\log.txt；别只弹 MessageBox。","loc":[["reader",68],["conn",63],["conn",142]]},{"sev":"BAD","title":"在 Timer.Tick 里弹模态 MessageBox，会把轮询拖垮","detail":"PoseTimer_Tick 读失败后弹 MessageBox.Show(...)。模态框会阻塞消息循环，定时器事件继续排队，用户关掉一个又冒一个；如果控制器反复断连，界面基本不可用。","fix":"Tick 里只把状态写进状态栏/Label（并变红），不弹窗；弹窗留给用户主动点击的动作。","loc":[["form",50]]},{"sev":"BAD","title":"扫描期间不禁用按钮，可以重复触发连接/登录","detail":"button1/button2 在执行期间既不 Disable 自身也不加忙标志，用户可以连点。连点「连接控制器」会反复 CreateFrom + Logon，而控制器同一时刻只给一个用户 mastership，日志里会出现莫名其妙的登录冲突。","fix":"进事件先 button.Enabled = false，finally 里恢复；或者用一个 isBusy 标志拦住重入。","loc":[["form",54],["form",75],["conn",129]]},{"sev":"WARN","title":"跨网段不可用：没有手工 IP 入口","detail":"只做局域网子网广播发现。控制器在另一个网段、或防火墙拦了广播时，永远扫不到。PCSDK 提供 NetworkScanner.AddRemoteController(string address)（静态方法）可以直接指定 IP，代码没调用。","fix":"加一个「手工 IP」输入框，调 NetworkScanner.AddRemoteController(ip) 后再 Scan()；顺手记住上次成功的 IP。","loc":[["conn",39],["conn",42]]},{"sev":"WARN","title":"FormClosing 被订阅两次","detail":"Designer.cs 第 367 行订阅了 this.FormClosing += Form1_FormClosing，Form1.cs 构造函数第 32 行又订阅了一次。关闭窗口时处理方法执行两遍：poseTimer.Stop() 与 DisconnectController() 都是幂等的，所以没出事，但这属于隐性冗余 —— 将来在处理方法里加了「弹确认框」或「写日志」就会看出问题。","fix":"只保留一处（把设计器里那行删掉，因为构造函数里已经有）。","loc":[["designer",367],["form",32]]},{"sev":"WARN","title":"死代码成群：空类、空事件、空方法、测试菜单、三个空右键菜单","detail":"Class1.cs 整个是模板残留；Form1_Load 是空方法；toolStripLabel1_Click 挂的控件在界面上根本不存在；toolStripMenuItem2_Click 是空的；菜单项文字写着 12231 / 12121；contextMenuStrip1~3 的 Size 是 (61,4)，里面一个菜单项都没有，也没有任何控件把它们当右键菜单用。","fix":"全部删除。删除前确认没有事件订阅引用它们（这几处都没有），删掉零影响。","loc":[["class1",9],["form",159],["form",190],["form",195],["designer",322],["designer",291]]},{"sev":"WARN","title":"全部绝对坐标布局，没有任何 Anchor / Dock / TableLayout","detail":"窗体和控件都用 Location + Size 的绝对像素摆放（ClientSize 966×569，AutoScaleMode=Font，基准 9F/20F）。换个 DPI、换台笔记本、用户改个字体大小，控件就会错位或重叠；窗口拉大缩小时所有控件原地不动，右下角大片空白。另外 button1 的 y=219 而 button2 的 y=216，已经先天错位 3 像素。","fix":"改用 TableLayoutPanel/FlowLayoutPanel 划分区域，或至少给每个控件设 Anchor；把按钮高度、间距抽成统一常量。","loc":[["designer",335],["designer",92],["designer",69]]},{"sev":"WARN","title":"double 装 float、F2 只给两位小数：精度观感上有损失","detail":"RobJoint.Rax_1 和 Pos.X/Y/Z 在 PCSDK 里都是 float（约 7 位有效数字），赋给 double 只是换更大的容器，不会变准。显示时 ToString(\"F2\") 又只留两位小数，看起来像 0.00 的轴，其实可能是 0.004。","fix":"显示用 F3（0.001 度）更符合示教器习惯；要知道精度下限就记住 float 约 7 位有效数字，别在 double 上做等值比较。","loc":[["pose",11],["form",149]]}],"links":[{"a":["program",19],"b":["designer",29],"label":"Application.Run(new Form1()) 触发构造函数 → InitializeComponent() 才把所有控件 new 出来。程序启动顺序就是这两跳。"},{"a":["designer",76],"b":["form",54],"label":"设计器里把 button1.Click 挂到 button1_Click；运行时点「扫描控制器」执行的就是 Form1.cs 第 54 行。"},{"a":["form",60],"b":["conn",32],"label":"界面层把活交给设备层：ScanControllers(out message)。注意是在 UI 线程上同步调用。"},{"a":["conn",42],"b":["conn",39],"label":"先 new NetworkScanner()，再 scanner.Scan() 做局域网广播发现；结果通过 scanner.Controllers 取出。"},{"a":["form",90],"b":["conn",98],"label":"button2_Click 调 ConnectFirstController() —— 写死第 0 台。这个包装方法只做一件事：转调 ConnectControllerByIndex(0)。"},{"a":["conn",104],"b":["conn",126],"label":"先 DisconnectController() 清旧连接，再 ControllerFactory.CreateFrom(info) 建新对象；CreateFrom 本身不联网。"},{"a":["conn",129],"b":["reader",28],"label":"controller.Logon(UserInfo.DefaultUser) 匿名登录成功后，MotionSystem.ActiveMechanicalUnit 才有意义 —— 读位姿的前提是已经登录。"},{"a":["form",129],"b":["reader",14],"label":"UpdateRobotPoseDisplay 把 abbService.CurrentController 和两个 out 变量交给 ReadRobotPose，这是 UI 层与数据层唯一的接口。"},{"a":["reader",37],"b":["pose",11],"label":"jointTarget.RobAx 的六个 Rax_n 抄进 DTO 的 J1~J6（float → double 只是换容器）。"},{"a":["reader",41],"b":["pose",18],"label":"robTarget.Trans.X/Y/Z（mm）与 Rot.Q1~Q4 抄进 DTO 的 TcpX/Y/Z 与 Q1~Q4。"},{"a":["pose",18],"b":["form",149],"label":"反向看这条：UpdateRobotPoseDisplay 只读了 J1~J6，TcpX/Y/Z 与 Q1~Q4 从此再没人碰 —— 死字段链。"},{"a":["reader",68],"b":["form",141],"label":"Reader 的 catch 把失败原因塞进 message，Form1 在 showErrorMessage=true 时把它弹出来；Timer 那条路径传 false，所以不弹。"},{"a":["form",50],"b":["form",48],"label":"Tick 读失败时先 poseTimer.Stop() 再弹窗：停表是为了不重复报错，但弹窗本身是模态的，会把消息循环堵住。"},{"a":["designer",367],"b":["form",32],"label":"同一个 FormClosing 事件被订阅两次（设计器一次、构造函数一次）。处理方法幂等，所以只是冗余，不是 bug。"},{"a":["form",95],"b":["conn",154],"label":"关窗时 Form1_FormClosing 先 Stop 定时器再 DisconnectController()：Logoff 释放 mastership、Dispose 释放连接，finally 里把 controller 置 null。"}]}</script>
<script>
(function(){
"use strict";
var D = JSON.parse(document.getElementById("DATA").textContent);
var $ = function(id){ return document.getElementById(id); };
var state = { tab:"home", file:(D.files[0]||{}).id, inline:false, allOpen:false, fs:12.5, sheetLine:0 };
var LASTKEY = "abbdt.reader.v1";

/* ---------- 工具 ---------- */
function esc(s){
  return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function noteOf(file, n){
  var m = D.lines[file] || {};
  var v = m[String(n)];
  if (v === undefined || v === null || v === "") return null;
  return Array.isArray(v) ? { short:v[0]||"", detail:v[1]||"" } : { short:v, detail:"" };
}
function noteText(file, n, withDetail){
  var o = noteOf(file, n);
  if (!o) return "";
  return o.short + (withDetail && o.detail ? "  " + o.detail : "");
}
function fileMeta(id){
  for (var i=0;i<D.files.length;i++){ if (D.files[i].id===id) return D.files[i]; }
  return D.files[0];
}
function blockOf(file, n){
  var bs = D.blocks[file] || [];
  for (var i=0;i<bs.length;i++){ if (n>=bs[i].a && n<=bs[i].b) return bs[i]; }
  return null;
}
function fmtText(t){
  if (!t) return "";
  var parts = String(t).split(/\n+/);
  var out = "";
  for (var i=0;i<parts.length;i++){
    if (parts[i]) out += "<p>" + esc(parts[i]) + "</p>";
  }
  return out;
}
/* 极简 C# 高亮 */
var KW = ("using namespace class struct public private protected internal static void bool double float int string var new return if else try catch finally foreach for while out null true false this base partial using get set override sealed abstract const readonly in is as throw object byte").split(" ");
var TY = ("System Windows Forms Math String Convert List Set Math Exception EventArgs Timer Button TextBox Label ListBox MenuStrip ToolStripMenuItem ContextMenuStrip ComponentResourceManager Font Point Size PointF Padding Color Icon Drawing EventHandler FormClosingEventHandler GraphicsUnit FontStyle AutoScaleMode FormStartPosition AutoScaleDimensions IContainer ComponentResourceManager Controller MechanicalUnit JointTarget RobJoint RobTarget Orient Pos ExtJoint ConfData ControllerInfo ControllerInfoCollection NetworkScanner ControllerFactory UserInfo AbbRobotPoseData AbbRobotPoseReader AbbControllerConnection Form1 Program Class1 MechanicalUnitType CoordinateSystemType MotionSystem RapidDomain MotionDomain Discovery").split(" ");
var KWS = {}, TYS = {};
for (var i=0;i<KW.length;i++) KWS[KW[i]] = 1;
for (var j=0;j<TY.length;j++) TYS[TY[j]] = 1;
function hl(line){
  var out = "", i = 0, n = line.length;
  while (i < n){
    var ch = line.charAt(i);
    if (ch === "/" && line.charAt(i+1) === "/"){
      out += '<span class="cm">' + esc(line.slice(i)) + "</span>"; break;
    }
    if (ch === '"'){
      var k = i+1, buf = '"';
      while (k < n){
        if (line.charAt(k) === "\\"){ buf += line.substr(k,2); k += 2; continue; }
        buf += line.charAt(k);
        if (line.charAt(k) === '"'){ k++; break; }
        k++;
      }
      out += '<span class="st">' + esc(buf) + "</span>"; i = k; continue;
    }
    if (ch === "#" ){
      var m = /^#[A-Za-z]+/.exec(line.slice(i));
      if (m){ out += '<span class="at">' + esc(m[0]) + "</span>"; i += m[0].length; continue; }
    }
    if (/[A-Za-z_]/.test(ch)){
      var w = /^[A-Za-z_][A-Za-z0-9_]*/.exec(line.slice(i))[0];
      var cls = KWS[w] ? "kw" : (TYS[w] ? "ty" : "");
      var nxt = line.slice(i+w.length, i+w.length+1);
      if (!cls && (nxt === "(" || nxt === ".")) cls = "";
      if (!cls && /^[A-Z]/.test(w)) cls = "ty";
      out += cls ? '<span class="'+cls+'">' + esc(w) + "</span>" : esc(w);
      i += w.length; continue;
    }
    if (/[0-9]/.test(ch)){
      var d = /^[0-9][0-9a-fA-FxX.]*[fFdDmMuUlL]?/.exec(line.slice(i))[0];
      out += '<span class="nm">' + esc(d) + "</span>"; i += d.length; continue;
    }
    out += esc(ch); i++;
  }
  return out || " ";
}

/* ---------- 页签 ---------- */
function setTab(t){
  state.tab = t;
  var views = ["home","code","concept","sim","issues"];
  for (var i=0;i<views.length;i++){
    var v = $("v-"+views[i]);
    if (v) v.hidden = (views[i] !== t);
  }
  var btns = document.querySelectorAll("#tabs button");
  for (var k=0;k<btns.length;k++){
    if (btns[k].getAttribute("data-tab") === t) btns[k].className = "on"; else btns[k].className = "";
  }
  $("subbar").className = (t === "code") ? "" : "hide";
  if (t !== "code"){ $("toolPanel").className = "hide"; }
  $("ctxName").textContent = (t === "code") ? fileMeta(state.file).name + " · " + fileMeta(state.file).lines + " 行" : "";
  if (t === "code") renderCode();
  if (t === "concept") renderConcept();
  if (t === "sim") renderSim();
  if (t === "issues") renderIssues();
  if (t === "home") renderHome();
  save();
}

/* ---------- 首页 ---------- */
function renderHome(){
  var o = D.overview || {};
  var h = "";
  h += '<div class="hero"><p>' + (o.pitch || "") + "</p>";
  if (o.pitch2) h += '<p>' + o.pitch2 + "</p>";
  h += '<div class="badges">' + (o.badges||[]).map(function(b){ return '<span class="pill '+(b.cls||"")+'">'+esc(b.t)+"</span>"; }).join("") + "</div></div>";

  h += '<div class="card"><h2><em>01</em>七个文件，谁管什么</h2>';
  h += '<p class="tip">点任意文件直接跳到它的逐行讲解。</p><div class="flist">';
  for (var i=0;i<D.files.length;i++){
    var f = D.files[i];
    h += '<button class="fitem" data-file="'+f.id+'"><span class="fn">'+esc(f.name)+'</span><span class="fr">'+esc(f.role)+'</span><span class="fl">'+f.lines+" 行</span></button>";
  }
  h += "</div></div>";

  h += '<div class="card"><h2><em>02</em>一次读取的完整链路</h2><p class="tip">点任意一步跳到对应代码行。</p><div class="flow">';
  var fl = o.flow || [];
  for (var k=0;k<fl.length;k++){
    var s = fl[k];
    h += '<button class="fstep" data-jump="'+s.file+":"+s.line+'"><span class="dot">'+(k+1)+'</span><span><span class="tt">'+esc(s.title)+'</span><br><span class="ds">'+esc(s.desc||"")+"</span></span></button>";
  }
  h += "</div></div>";

  if (o.conclusions && o.conclusions.length){
    h += '<div class="card"><h2><em>03</em>结论速览</h2><div class="concl">';
    for (var c=0;c<o.conclusions.length;c++){
      var it = o.conclusions[c];
      h += '<div class="c-item"><em>'+(c+1)+'</em><span>'+esc(it.t);
      if (it.file) h += ' <button class="jump" data-jump="'+it.file+":"+it.line+'">看代码</button>';
      h += "</span></div>";
    }
    h += "</div></div>";
  }
  if (o.notes && o.notes.length){
    h += '<div class="card"><h2><em>04</em>读之前先知道</h2>';
    for (var q=0;q<o.notes.length;q++) h += "<p>" + esc(o.notes[q]) + "</p>";
    h += "</div>";
  }
  $("v-home").innerHTML = h;
}

/* ---------- 代码 ---------- */
function renderChips(){
  var h = "";
  for (var i=0;i<D.files.length;i++){
    var f = D.files[i];
    h += '<button class="chip'+(f.id===state.file?" on":"")+'" data-file="'+f.id+'">'+esc(f.name)+"</button>";
  }
  $("fileChips").innerHTML = h;
}
function renderCode(){
  var f = fileMeta(state.file), src = String(f.src||"").split("\n");
  var bs = D.blocks[state.file] || [];

function nearestNote(from, dir){
  var m = D.lines[state.file] || {}, n = from + dir;
  while (n >= 1 && n <= 20000){

  return 0;
}

  if (t.id === "swInline"){ state.inline = !state.inline; t.className = "sw" + (state.inline?" on":""); renderCode(); restoreOpen(); return; }
  if (t.id === "swAll"){
    state.allOpen = !state.allOpen; t.className = "sw" + (state.allOpen?" on":"");
    collapseAll(!state.allOpen); return;
  }
  if (t.id === "swMap"){ $("bmapWrap").className = ($("bmapWrap").className === "hide") ? "" : "hide"; return; }
  if (t.id === "fsUp"){ state.fs = Math.min(20, state.fs + 1); applyFs(); return; }
  if (t.id === "fsDown"){ state.fs = Math.max(9, state.fs - 1); applyFs(); return; }
  if (t.id === "mask" || t.id === "shClose"){ closeSheet(); return; }
  if (t.id === "shPrev"){ var p = nearestNote(state.sheetLine,-1); if (p){ state.sheetLine = p; paintSheet(); jump(state.file,p,true); } return; }
  if (t.id === "shNext"){ var q2 = nearestNote(state.sheetLine,1); if (q2){ state.sheetLine = q2; paintSheet(); jump(state.file,q2,true); } return; }
  var sr = up(".sr");
  if (sr){ var v2 = sr.getAttribute("data-jump").split(":"); $("searchWrap").className = "hide"; jump(v2[0], parseInt(v2[1],10)); return; }
});
function restoreOpen(){ /* 内联切换后保持全部块展开，便于通读 */ collapseAll(false); }
function applyFs(){
  document.documentElement.style.setProperty("--fs", state.fs + "px");
  save();
}

/* ---------- 搜索 ---------- */
function doSearch(){
  var q = $("q").value.trim().toLowerCase();
  var res = $("qRes");
  if (!q){ res.innerHTML = '<div class="empty">输入关键词开始搜索（支持代码与讲解文本）</div>'; return; }
  var out = [], total = 0;
  for (var i=0;i<D.files.length && out.length < 80;i++){
    var f = D.files[i], src = String(f.src||"").split("\n");
    for (var n=1;n<=src.length;n++){
      var code = src[n-1] || "";
      var nt = noteText(f.id, n, false);
      if ((code.toLowerCase().indexOf(q) >= 0) || (nt.toLowerCase().indexOf(q) >= 0)){
        out.push({ fid:f.id, name:f.name, line:n, code:code, note:nt });
        total++;
        if (out.length >= 80) break;
      }
    }
  }
  if (!out.length){ res.innerHTML = '<div class="empty">没找到「' + esc($("q").value) + '」</div>'; return; }
  var h = "";
  for (var k=0;k<out.length;k++){
    var o = out[k];
    h += '<div class="sr" data-jump="'+o.fid+":"+o.line+'"><div class="lc">'+esc(o.name)+":"+o.line+'</div><div class="cd">'+esc(o.code.trim()||"（空行）")+"</div>"+(o.note?'<div class="nt">'+esc(o.note)+"</div>":"")+"</div>";
  }
  if (total > out.length) h += '<div class="empty">结果太多，只显示前 ' + out.length + " 条</div>";
  res.innerHTML = h;
}

/* ---------- 记忆 ---------- */
function save(){
  try{ localStorage.setItem(LASTKEY, JSON.stringify({ tab:state.tab, file:state.file, inline:state.inline, fs:state.fs })); }catch(e){}
}
function load(){
  try{
    var raw = localStorage.getItem(LASTKEY);
    if (!raw) return;
    var o = JSON.parse(raw);
    if (o.file) state.file = o.file;
    if (o.inline) state.inline = true;
    if (o.fs) state.fs = o.fs;
    if (o.tab) state.tab = o.tab;
  }catch(e){}
}

/* ---------- 启动 ---------- */
load();
document.documentElement.style.setProperty("--fs", state.fs + "px");
$("swInline").className = "sw" + (state.inline?" on":"");
renderChips();
$("q").addEventListener("input", doSearch);
window.addEventListener("resize", function(){ if (state.tab === "sim") fitStage(); });
window.addEventListener("orientationchange", function(){ setTimeout(function(){ if (state.tab === "sim") fitStage(); }, 250); });
setTab(state.tab || "home");
renderHome();
if (D.files.length && !D.blocks[state.file]) state.file = D.files[0].id;
})();
</script>
