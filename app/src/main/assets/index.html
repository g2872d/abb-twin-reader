<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0d1014">
<title>ABB Digital Twin · 逐行讲解</title>
<style>
:root{
  --bg:#0d1014;--bg2:#12161d;--bg3:#171c25;--bg4:#1c2430;--line:#232a36;
  --fg:#c9d3e0;--fg2:#8b9ab0;--fg3:#5a6779;
  --acc:#4a9eff;--ok:#3fb950;--warn:#d29922;--bad:#f85149;--vio:#bc8cff;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"Roboto Mono","DejaVu Sans Mono",monospace;
  --fs:12.5px;
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--bg);color:var(--fg);font:14px/1.55 -apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  display:flex;flex-direction:column;overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
select{font:inherit;color:var(--fg);background:var(--bg3);border:1px solid var(--line);border-radius:7px;padding:5px 8px}
.hide{display:none !important}

/* ---------- 顶栏 ---------- */
header{flex:0 0 auto;padding:calc(var(--sat) + 8px) 12px 0;background:linear-gradient(180deg,#151a23,#0e1218);border-bottom:1px solid var(--line);z-index:20}
.hrow{display:flex;align-items:center;gap:8px}
h1{margin:0;font-size:15px;font-weight:600;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 0 auto;max-width:58%}
h1 b{color:var(--acc);font-weight:600}
.ctx{color:var(--fg3);font-size:11.5px;font-family:var(--mono);flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ibtn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
.ibtn:active{background:var(--bg4)}
#subbar{display:flex;gap:8px;align-items:center;padding:8px 0 9px;overflow-x:auto;-webkit-overflow-scrolling:touch}
#subbar::-webkit-scrollbar{display:none}
.chips{display:flex;gap:6px;flex:1 1 auto}
.chip{flex:0 0 auto;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--bg2);color:var(--fg2);font:11.5px/1 var(--mono);white-space:nowrap}
.chip.on{background:#17233a;color:var(--acc);border-color:#2a4a74}
#toolPanel{padding:6px 0 10px;border-top:1px dashed var(--line);margin-top:2px}
.trow{display:flex;flex-wrap:wrap;gap:7px;align-items:center;padding:4px 0}
.trow .lbl{color:var(--fg3);font-size:11.5px;margin-right:2px}
.sw{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg2);font-size:12px;color:var(--fg2)}
.sw.on{background:#17233a;color:var(--acc);border-color:#2a4a74}
.stepper{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.stepper button{padding:6px 11px;background:var(--bg2);font-family:var(--mono);font-size:12px}
.stepper button:active{background:var(--bg4)}

/* ---------- 视图容器 ---------- */
main{flex:1 1 auto;position:relative;overflow:hidden}
.view{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 24px}
.view[hidden]{display:none !important}

/* ---------- 底部页签 ---------- */
nav#tabs{flex:0 0 auto;display:flex;background:#0b0e12;border-top:1px solid var(--line);padding-bottom:var(--sab);z-index:20}
nav#tabs button{flex:1 1 0;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--fg3);font-size:10.5px}
nav#tabs button i{font-style:normal;font-size:17px;line-height:1}
nav#tabs button.on{color:var(--acc)}

/* ---------- 通用卡片 ---------- */
.card{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 10px}
.card h2{font-size:13px;margin:0 0 8px;color:var(--fg);display:flex;align-items:center;gap:6px}
.card h2 em{font-style:normal;color:var(--acc);font-family:var(--mono);font-size:11px}
.tip{color:var(--fg3);font-size:12px;margin:0 0 8px}
.kv{display:grid;grid-template-columns:88px 1fr;gap:5px 10px;font-size:12.5px}
.kv dt{color:var(--fg3)}
.kv dd{margin:0;color:var(--fg);word-break:break-word}
.mono{font-family:var(--mono)}
.pill{display:inline-block;padding:1px 7px;border-radius:999px;font:11px/1.7 var(--mono);border:1px solid var(--line);color:var(--fg2);background:var(--bg3)}
.pill.ok{color:var(--ok);border-color:#1d4429;background:#0f2016}
.pill.bad{color:var(--bad);border-color:#5a1d1d;background:#200f0f}
.pill.warn{color:var(--warn);border-color:#4a3a12;background:#1e1810}
.pill.acc{color:var(--acc);border-color:#22405f;background:#101a26}
.jump{border:1px dashed #2b3d55;color:var(--acc);border-radius:8px;padding:3px 8px;font:11.5px var(--mono);background:#0f1722}

/* 首页 */
.hero{background:linear-gradient(160deg,#17202c,#101720);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.hero p{margin:0 0 8px;font-size:13.5px;line-height:1.65}
.hero p:last-child{margin:0}
.hero b{color:#e6edf7}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0}
.flist{display:flex;flex-direction:column;gap:6px}
.fitem{display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg3);text-align:left;width:100%}
.fitem .fn{font:12.5px var(--mono);color:var(--fg);flex:0 0 auto;white-space:nowrap}
.fitem .fr{flex:1 1 auto;min-width:0;color:var(--fg3);font-size:11.5px;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fitem .fl{font:11px var(--mono);color:var(--acc);flex:0 0 auto;white-space:nowrap;opacity:.8}
.flow{display:flex;flex-direction:column;gap:0}
.fstep{display:grid;grid-template-columns:26px 1fr;gap:9px;align-items:start;padding:7px 0}
.fstep .dot{width:24px;height:24px;border-radius:50%;background:#152238;border:1px solid #2b4a70;color:var(--acc);font:11px/24px var(--mono);text-align:center}
.fstep .tt{font-size:12.5px}
.fstep .ds{color:var(--fg3);font-size:11.5px}
.fstep:not(:last-child) .dot::after{content:"";display:block}
.concl{counter-reset:c;display:flex;flex-direction:column;gap:7px}
.concl .c-item{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start;padding:8px 9px;border:1px solid var(--line);border-radius:10px;background:var(--bg3)}
.concl .c-item em{font:11px/18px var(--mono);color:var(--fg3);font-style:normal;text-align:center}

/* ---------- 代码视图 ---------- */
#codeWrap{padding:0 0 30px}
.blk{margin:0 0 10px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg2)}
.blk-h{display:flex;align-items:baseline;gap:7px;padding:9px 10px;background:#141a24;border-bottom:1px solid var(--line);cursor:pointer}
.bk-caret{color:var(--acc);font-size:11px;transition:transform .15s;flex:0 0 auto}
.blk.folded .bk-caret{transform:rotate(-90deg)}
.bk-t{font-size:12.5px;color:#dfe8f4;font-weight:600;flex:0 0 auto}
.bk-b{font-size:11.5px;color:var(--fg3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1 1 auto}
.bk-r{font:10.5px var(--mono);color:var(--fg3);flex:0 0 auto}
.blk-d{padding:9px 11px;border-bottom:1px solid var(--line);background:#101620;font-size:12.5px;color:var(--fg2);line-height:1.7}
.blk-d p{margin:0 0 7px}
.blk-d p:last-child{margin:0}
.blk-d .api,.blk-d .gotcha{margin-top:7px;padding:7px 9px;border-radius:8px;font-size:12px;line-height:1.65}
.blk-d .api{background:#0e1a28;border-left:2px solid var(--acc);color:#a8c4e0}
.blk-d .api b{color:var(--acc);font-family:var(--mono);font-size:11px;margin-right:6px}
.blk-d .gotcha{background:#1e1410;border-left:2px solid var(--warn);color:#d9bb8a}
.blk-d .gotcha b{color:var(--warn);font-size:11px;margin-right:6px}
.blk.folded .lns,.blk.folded .blk-d{display:none}
.lns{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
.ln{display:flex;min-height:1.55em;font:var(--fs)/1.62 var(--mono);position:relative;border-left:2px solid transparent}
.ln .g{flex:0 0 34px;text-align:right;padding-right:8px;color:#3c4757;user-select:none;font-size:.92em;line-height:1.62}
.ln .c{flex:0 0 auto;white-space:pre;padding-right:14px;color:#c3cddb}
.ln.has .g{color:var(--acc);opacity:.85}
.ln.has .c{box-shadow:inset 0 -1px 0 rgba(74,158,255,.16)}
.ln.on{background:#17233a;border-left-color:var(--acc)}
.ln.flash{animation:fl 1.1s ease-out}
@keyframes fl{0%{background:#1f3d63}100%{background:transparent}}
.ln-note{padding:2px 10px 6px 44px;font:12px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#8fa3bb;border-left:2px solid #1d2733;background:#0f141c}
.ln-note i{color:var(--acc);font-style:normal;margin-right:4px}
.ln-note .d{display:block;color:var(--fg3);margin-top:3px}
.kw{color:#c792ea}.ty{color:#7fdbca}.st{color:#ecc48d}.cm{color:#5c6b7e;font-style:italic}.nm{color:#f78c6c}.at{color:#ffcb6b}
/* 块地图 */
.bmap{display:flex;flex-direction:column;gap:6px}
.bmap button{text-align:left;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg3);display:flex;gap:8px;align-items:baseline}
.bmap button .r{font:10.5px var(--mono);color:var(--fg3);flex:0 0 auto}
.bmap button .t{font-size:12.5px;color:var(--fg)}

/* ---------- 概念视图 ---------- */
.pair{display:grid;grid-template-columns:1fr;gap:8px}
.pcard{border:1px solid var(--line);border-radius:11px;background:var(--bg2);padding:11px}
.pcard h3{margin:0 0 6px;font-size:13px;color:#e3ecf7}
.pcard p{margin:0 0 6px;font-size:12.5px;color:var(--fg2);line-height:1.7}
.pcard .ex{font:11.5px var(--mono);color:var(--fg3)}
.rel{display:flex;flex-direction:column;gap:8px}
.rel-item{border:1px solid var(--line);border-radius:10px;background:var(--bg3);padding:9px 10px}
.rel-item .lr{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font:11.5px var(--mono);color:var(--fg2)}
.rel-item .lb{color:var(--fg3);font-size:11.5px;margin-top:5px;line-height:1.6}

/* ---------- 模拟视图 ---------- */
.simbar{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:9px}
.stage{position:relative;width:100%;overflow:hidden;border-radius:10px;border:1px solid var(--line);background:#f0f0f0}
.stage .f1{position:absolute;top:0;left:0;width:966px;height:569px;transform-origin:0 0;background:#f0f0f0;color:#000;font:12px "Microsoft YaHei",sans-serif}
.f1 .w{position:absolute;background:#fff;border:1px solid #8c8c8c;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;user-select:none}
.f1 .w.btn{background:linear-gradient(#fdfdfd,#e8e8e8);border-color:#707070;font-size:13px}
.f1 .w.btn:active{background:#d8e6f7}
.f1 .w.btn.hot{outline:2px solid #0a84ff;outline-offset:-2px}
.f1 .w.lb{border:0;background:transparent;justify-content:flex-end;padding-right:4px;font-size:13px;cursor:default}
.f1 .w.tb{background:#fff;justify-content:flex-start;padding:0 5px;font:13px "Microsoft YaHei",sans-serif}
.f1 .w.lst{background:#fff;display:block;padding:3px 5px;font:12px/20px "Microsoft YaHei",sans-serif;overflow:auto;white-space:pre;color:#222;justify-content:flex-start;align-items:flex-start}
.f1 .w.lst.sel{background:#cfe3ff}
.f1 .w.menu{justify-content:flex-start;padding:0 6px;background:#f7f7f7;border-bottom:1px solid #c8c8c8;font-size:12px}
.f1 .w.title{justify-content:flex-start;padding:0 8px;font-size:12px;color:#555;background:#f0f0f0;border-bottom:1px solid #d8d8d8}
.f1 .w.title b{color:#222;font-weight:600}
.f1 .hint{position:absolute;left:0;right:0;top:400px;text-align:center;color:#9aa4b2;font-size:13px}
.readout{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0 0}
.ro{border:1px solid var(--line);border-radius:10px;background:var(--bg3);padding:8px 6px;text-align:center}
.ro .k{font:11px var(--mono);color:var(--fg3)}
.ro .v{font:16px/1.35 var(--mono);color:#e6eef8;overflow:hidden;text-overflow:ellipsis}
.ro.dead .v{color:var(--bad)}
.ex ec{display:block}
.exec{border:1px solid #2b4a70;background:#0f1a2a;border-radius:10px;padding:9px 10px;margin-top:10px;font-size:12.5px}
.exec .who{font:11.5px var(--mono);color:var(--acc)}
.exec .what{color:#b8c7da;margin-top:3px;line-height:1.6}
.logbox{margin-top:9px;border:1px solid var(--line);border-radius:10px;background:#0b0f14;padding:8px 9px;font:11.5px/1.7 var(--mono);color:#8fa3bb;max-height:150px;overflow:auto;white-space:pre-wrap}

/* ---------- 问题清单 ---------- */
.it{border:1px solid var(--line);border-radius:11px;background:var(--bg2);padding:11px;margin-bottom:9px}
.it .hd{display:flex;gap:7px;align-items:center;margin-bottom:6px}
.it .hd .t{font-size:13px;color:#e6eef8;font-weight:600;flex:1 1 auto;line-height:1.45}
.it p{margin:0 0 7px;font-size:12.5px;color:var(--fg2);line-height:1.7}
.it .fix{font-size:12px;color:#9fd6a8;background:#0f1f15;border-left:2px solid var(--ok);padding:7px 9px;border-radius:8px;line-height:1.65}
.it .loc{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

/* ---------- 抽屉 ---------- */
#mask{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;opacity:0;pointer-events:none;transition:opacity .18s}
#mask.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#111721;border-top:1px solid #2a3546;border-radius:16px 16px 0 0;max-height:78vh;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .22s cubic-bezier(.22,.8,.3,1);padding-bottom:var(--sab);box-shadow:0 -12px 40px rgba(0,0,0,.6)}
#sheet.on{transform:translateY(0)}
.sh-h{display:flex;align-items:center;gap:8px;padding:10px 12px 8px;border-bottom:1px solid var(--line);flex:0 0 auto}
.sh-h .who{font:12px var(--mono);color:var(--acc);flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh-h .x{width:30px;height:30px;border-radius:8px;background:var(--bg3);border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.sh-b{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 12px 12px}
.sh-b pre.code{margin:0 0 9px;padding:8px 10px;background:#0a0e13;border:1px solid var(--line);border-radius:8px;overflow-x:auto;font:12px/1.6 var(--mono);color:#c3cddb;white-space:pre-wrap;word-break:break-word}
.sh-note{font-size:14px;line-height:1.75;color:#dbe6f3}
.sh-note .d{display:block;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);color:var(--fg2);font-size:13px}
.sh-blk{margin-top:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg3);padding:9px 10px}
.sh-blk .bt{font-size:12.5px;color:#e6eef8;margin-bottom:4px}
.sh-blk .bd{font-size:12px;color:var(--fg2);line-height:1.7}
.sh-f{padding:8px 12px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;flex:0 0 auto}
.sh-f .nav{flex:1 1 0;padding:9px 0;text-align:center;border:1px solid var(--line);border-radius:9px;background:var(--bg3);font-size:12.5px;color:var(--fg2)}
.sh-f .nav:active{background:var(--bg4)}
.sh-f .nav[disabled]{opacity:.4}

/* ---------- 搜索 ---------- */
#searchWrap{position:fixed;inset:0;z-index:60;background:#0c1016;display:flex;flex-direction:column;padding-top:var(--sat)}
#searchWrap .top{display:flex;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
#searchWrap input{flex:1 1 auto;font:14px var(--mono);color:var(--fg);background:var(--bg3);border:1px solid var(--line);border-radius:9px;padding:9px 11px;outline:none}
#searchWrap .res{flex:1 1 auto;overflow-y:auto;padding:10px 12px 30px}
.sr{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg2);margin-bottom:7px}
.sr .lc{font:11px var(--mono);color:var(--acc);margin-bottom:3px}
.sr .cd{font:11.5px var(--mono);color:#b9c6d6;white-space:pre;overflow:hidden;text-overflow:ellipsis}
.sr .nt{font-size:12px;color:var(--fg3);margin-top:4px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{color:var(--fg3);font-size:12.5px;padding:14px;text-align:center}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <h1>ABB Digital Twin <b>逐行讲解</b></h1>
    <span class="ctx" id="ctxName"></span>
    <button class="ibtn" id="btnSearch" aria-label="搜索">🔍</button>
  </div>
  <div id="subbar" class="hide">
    <div class="chips" id="fileChips"></div>
    <button class="ibtn" id="btnTools" aria-label="显示选项">⚙</button>
  </div>
  <div id="toolPanel" class="hide">
    <div class="trow">
      <span class="lbl">逐行注释</span>
      <button class="sw" id="swInline">行下直接显示</button>
      <button class="sw" id="swAll">展开全部块说明</button>
    </div>
    <div class="trow">
      <span class="lbl">字号</span>
      <span class="stepper"><button id="fsDown">A−</button><button id="fsUp">A+</button></span>
      <span class="lbl" style="margin-left:6px">本文件块地图</span>
      <button class="sw" id="swMap">展开</button>
    </div>
    <div id="bmapWrap" class="hide"><div class="bmap" id="bmap"></div></div>
  </div>
</header>

<main>
  <section class="view" id="v-home"></section>
  <section class="view" id="v-code" hidden><div id="codeWrap"></div></section>
  <section class="view" id="v-concept" hidden></section>
  <section class="view" id="v-sim" hidden></section>
  <section class="view" id="v-issues" hidden></section>
</main>

<nav id="tabs">
  <button data-tab="home"><i>◎</i>总览</button>
  <button data-tab="code"><i>⌨</i>逐行</button>
  <button data-tab="concept"><i>◇</i>概念</button>
  <button data-tab="sim"><i>▶</i>模拟</button>
  <button data-tab="issues"><i>!</i>问题</button>
</nav>

<div id="mask"></div>
<div id="sheet">
  <div class="sh-h">
    <span class="who" id="shWho"></span>
    <button class="x" id="shClose">✕</button>
  </div>
  <div class="sh-b" id="shBody"></div>
  <div class="sh-f">
    <button class="nav" id="shPrev">⟨ 上一行</button>
    <button class="nav" id="shNext">下一行 ⟩</button>
  </div>
</div>

<div id="searchWrap" class="hide">
  <div class="top">
    <input id="q" type="search" placeholder="搜代码 / 搜讲解，例如 GetPosition、四元数" autocomplete="off">
    <button class="ibtn" id="qClose">✕</button>
  </div>

</div>

ing System.Text;\nusing System.Threading.Tasks;\nusing ABB.Robotics.Controllers;\nusing ABB.Robotics.Controllers.MotionDomain;\nusing ABB.Robotics.Controllers.RapidDomain;\n\nnamespace ABB_Digital_Twin\n{\n    public class AbbRobotPoseReader\n    {\n        public bool ReadRobotPose(Controller controller, out AbbRobotPoseData poseData, out string message)\n        {\n            poseData = null;\n            message = \"\";\n\n            try\n            {\n                if (controller == null)\n                {\n                    message = \"请先连接 ABB 控制器。\";\n                    return false;\n                }\n\n                // 获取当前活动机械单元\n                MechanicalUnit mechUnit = controller.MotionSystem.ActiveMechanicalUnit;\n\n                if (mechUnit == null)\n                {\n                    message = \"没有找到当前活动机械单元。\";\n                    return false;\n                }\n\n                // 读取六轴关节角\n                JointTarget jointTarget = mechUnit.GetPosition();\n                RobJoint robJoint = jointTarget.RobAx;\n\n                // 读取 TCP 位姿，World 表示世界坐标系\n                RobTarget robTarget = mechUnit.GetPosition(CoordinateSystemType.World);\n\n                poseData = new AbbRobotPoseData();\n\n                poseData.MechanicalUnitName = mechUnit.Name;\n\n                poseData.J1 = robJoint.Rax_1;\n                poseData.J2 = robJoint.Rax_2;\n                poseData.J3 = robJoint.Rax_3;\n                poseData.J4 = robJoint.Rax_4;\n                poseData.J5 = robJoint.Rax_5;\n                poseData.J6 = robJoint.Rax_6;\n\n                poseData.TcpX = robTarget.Trans.X;\n                poseData.TcpY = robTarget.Trans.Y;\n                poseData.TcpZ = robTarget.Trans.Z;\n\n                poseData.Q1 = robTarget.Rot.Q1;\n                poseData.Q2 = robTarget.Rot.Q2;\n                poseData.Q3 = robTarget.Rot.Q3;\n                poseData.Q4 = robTarget.Rot.Q4;\n\n                message = \"读取机器人姿态成功。\";\n                return true;\n            }\n            catch (Exception ex)\n            {\n                message = \"读取机器人姿态失败：\" + ex.Message;\n                return false;\n            }\n        }\n    }\n    \n}"},{"id":"conn","name":"AbbControllerConnection.cs","lines":175,"role":"扫描 / 连接 / 断开","layer":"设备层","src":"using System;\nusing System.Collections.Generic;\nusing System.Linq;\nusing System.Text;\nusing System.Threading.Tasks;\nusing ABB.Robotics.Controllers;\nusing ABB.Robotics.Controllers.Discovery;\n\nnamespace ABB_Digital_Twin\n{\n    internal class AbbControllerConnection\n    {\n        // 当前已经连接的 ABB 控制器对象\n        private Controller controller = null;\n\n        // 扫描到的控制器列表\n        private List<ControllerInfo> controllerList = new List<ControllerInfo>();\n\n        // 对外提供当前控制器对象，后面读取 TCP、关节角时可能会用到\n        public Controller CurrentController\n        {\n            get { return controller; } \n        }\n\n        // 对外提供扫描到的控制器数量\n        public int ControllerCount\n        {\n            get { return controllerList.Count; }\n        }\n\n        // 扫描 ABB 控制器\n        public bool ScanControllers(out string message)\n        {\n            try\n            {\n                controllerList.Clear();\n\n                //NetworkScanner搜索控制柜指令来自ABB pc sdk\n                NetworkScanner scanner = new NetworkScanner();\n\n                // 扫描当前网络中的 ABB 控制器\n                scanner.Scan();\n                //将扫描的数据类型赋值给自己定义的controllers\n                ControllerInfoCollection controllers = scanner.Controllers;\n\n                foreach (ControllerInfo info in controllers)\n                {\n                    controllerList.Add(info);\n                }\n\n                if (controllerList.Count == 0)\n                {\n                    message = \"没有扫描到 ABB 控制器。\";\n                    return false;\n                }\n\n                message = \"扫描成功，共扫描到 \" + controllerList.Count + \" 个控制器。\";\n                return true;\n            }\n            catch (Exception ex)\n            {\n                message = \"扫描失败：\" + ex.Message;\n                return false;\n            }\n        }\n\n        // 获取控制器显示信息\n        public List<string> GetControllerDisplayLines()\n        {\n            List<string> lines = new List<string>();\n\n            if (controllerList.Count == 0)\n            {\n                lines.Add(\"没有扫描到 ABB 控制器。\");\n                lines.Add(\"请确认电脑和控制柜在同一网络。\");\n                return lines;\n            }\n\n            int index = 1;\n\n            foreach (ControllerInfo info in controllerList)\n            {\n                lines.Add(\"========== 控制器 \" + index + \" ==========\");\n                lines.Add(\"IP: \" + info.IPAddress.ToString());\n                lines.Add(\"系统名: \" + info.SystemName);\n                lines.Add(\"RobotWare: \" + info.Version.ToString());\n                lines.Add(\"控制器名: \" + info.ControllerName);\n                lines.Add(\"是否虚拟控制器: \" + info.IsVirtual.ToString());\n                lines.Add(\"\");\n\n                index++;\n            }\n\n            return lines;\n        }\n\n        // 默认连接第一个控制器\n        public bool ConnectFirstController(out string message)\n        {\n            return ConnectControllerByIndex(0, out message);\n        }\n\n        // 根据序号连接控制器\n        public bool ConnectControllerByIndex(int index, out string message)\n        {\n            try\n            {\n                if (controllerList.Count == 0)\n                {\n                    message = \"没有可连接的控制器，请先扫描控制器。\";\n                    return false;\n                }\n\n                if (index < 0 || index >= controllerList.Count)\n                {\n                    message = \"控制器序号无效。\";\n                    return false;\n                }\n\n                ControllerInfo info = controllerList[index];\n\n                // 如果之前已经连接过，先断开旧连接\n                DisconnectController();\n\n                // 创建控制器对象\n                controller = ControllerFactory.CreateFrom(info);\n\n                // 登录控制器\n                controller.Logon(UserInfo.DefaultUser);\n\n                message =\n                    \"连接成功！\\n\" +\n                    \"控制器名：\" + info.ControllerName + \"\\n\" +\n                    \"系统名：\" + info.SystemName + \"\\n\" +\n                    \"IP：\" + info.IPAddress.ToString();\n\n                return true;\n            }\n            catch (Exception ex)\n            {\n                message = \"连接失败：\" + ex.Message;\n\n                if (controller != null)\n                {\n                    controller.Dispose();\n                    controller = null;\n                }\n\n                return false;\n            }\n        }\n\n        // 断开旧连接\n        public void DisconnectController()\n        {\n            if (controller != null)\n            {\n                try\n                {\n                    controller.Logoff();\n                    controller.Dispose();\n                }\n                catch\n                {\n                    // 断开过程中如果出错，这里先忽略，避免程序崩溃\n                }\n                finally\n                {\n                    controller = null;\n                }\n            }\n        }\n\n    }\n}"},{"id":"form","name":"Form1.cs","lines":200,"role":"UI 事件 + 500ms 定时器","layer":"界面层","src":"using System;\nusing System.Collections.Generic;\nusing System.ComponentModel;\nusing System.Data;\nusing System.Drawing;\nusing System.Linq;\nusing System.Text;\nusing System.Threading.Tasks;\nusing System.Windows.Forms;\n\n\nnamespace ABB_Digital_Twin\n{\n    public partial class Form1 : Form\n    {\n        AbbControllerConnection abbService = new AbbControllerConnection();\n        AbbRobotPoseReader poseReader = new AbbRobotPoseReader();\n        private System.Windows.Forms.Timer poseTimer = new System.Windows.Forms.Timer();\n        public Form1()\n        {\n            InitializeComponent();\n            // 设置定时器刷新周期\n            // 500 表示每 500 毫秒读取一次，也就是每秒读取 2 次\n            // 初期建议先用 500，稳定后可以改成 200\n            poseTimer.Interval = 500;\n\n            // 绑定定时器事件\n            // 每到一次时间，就会自动执行 PoseTimer_Tick 方法\n            poseTimer.Tick += PoseTimer_Tick;\n\n            // 关闭窗口时，停止定时器并断开 ABB 控制器连接\n            this.FormClosing += Form1_FormClosing;\n        }\n        /// <summary>\n        /// Timer 定时触发事件。\n        /// 只要 poseTimer.Start() 启动了定时器，\n        /// 这个方法就会每隔 poseTimer.Interval 毫秒自动执行一次。\n        /// <\/summary>\n        private void PoseTimer_Tick(object sender, EventArgs e)\n        {\n            // 定时读取机器人姿态\n            bool readOk = UpdateRobotPoseDisplay(false);\n\n            // 如果读取失败，说明可能控制器断开、未连接、RobotStudio关闭等\n            if (!readOk)\n            {\n                // 停止定时器，避免一直重复报错\n                poseTimer.Stop();\n\n                MessageBox.Show(\"实时读取已停止，请检查 ABB 控制器连接状态。\");\n            }\n        }\n\n        private void button1_Click(object sender, EventArgs e)\n        {\n            listBox1.Items.Clear();\n\n            string message;\n\n            bool scanOk = abbService.ScanControllers(out message);\n\n            List<string> lines = abbService.GetControllerDisplayLines();\n\n            foreach (string line in lines)\n            {\n                listBox1.Items.Add(line);\n            }\n\n            if (!scanOk)\n            {\n                MessageBox.Show(message);\n            }\n        }\n\n        private void button2_Click(object sender, EventArgs e)\n        {\n            string message;\n\n            if (abbService.ControllerCount == 0)\n            {\n                bool scanOk = abbService.ScanControllers(out message);\n\n                if (!scanOk)\n                {\n                    MessageBox.Show(message);\n                    return;\n                }\n            }\n\n            bool connectOk = abbService.ConnectFirstController(out message);\n\n            MessageBox.Show(message);\n        }\n\n        private void Form1_FormClosing(object sender, FormClosingEventArgs e)\n        {\n            // 关闭窗口前，先停止定时器\n            // 避免软件正在关闭时 Timer 还在读机器人数据\n            poseTimer.Stop();\n\n            // 断开 ABB 控制器连接，释放资源\n            abbService.DisconnectController();\n        }\n\n        private void button3_Click(object sender, EventArgs e)\n        {\n            UpdateRobotPoseDisplay(true);\n        }\n        /// <summary>\n        /// 读取机器人六轴姿态，并显示到 txtJ1 ~ txtJ6\n        /// <\/summary>\n        /// <param name=\"showErrorMessage\">\n        /// 是否显示错误弹窗。\n        /// 手动点击按钮时可以显示错误；\n        /// Timer 实时刷新时建议也可以显示一次错误并停止定时器。\n        /// <\/param>\n        /// <returns>\n        /// true 表示读取成功；false 表示读取失败。\n        /// <\/returns>\n        private bool UpdateRobotPoseDisplay(bool showErrorMessage)\n        {\n            // 用来保存读取到的机器人姿态数据\n            AbbRobotPoseData poseData;\n\n            // 用来保存读取结果提示信息\n            string message;\n\n            // 调用姿态读取类，从当前连接的 ABB 控制器中读取 J1~J6\n            bool readOk = poseReader.ReadRobotPose(\n                abbService.CurrentController,\n                out poseData,\n                out message\n            );\n\n            // 如果读取失败\n            if (!readOk)\n            {\n                // 如果允许弹窗，就显示错误原因\n                if (showErrorMessage)\n                {\n                    MessageBox.Show(message);\n                }\n\n                return false;\n            }\n\n            // 将读取到的六轴角度显示到 TextBox\n            // F2 表示保留两位小数\n            txtJ1.Text = poseData.J1.ToString(\"F2\");\n            txtJ2.Text = poseData.J2.ToString(\"F2\");\n            txtJ3.Text = poseData.J3.ToString(\"F2\");\n            txtJ4.Text = poseData.J4.ToString(\"F2\");\n            txtJ5.Text = poseData.J5.ToString(\"F2\");\n            txtJ6.Text = poseData.J6.ToString(\"F2\");\n\n            return true;\n        }\n\n        private void Form1_Load(object sender, EventArgs e)\n        {\n\n        }\n\n        private void btnStartRealTime_Click(object sender, EventArgs e)\n        {\n            // 启动实时读取前，先尝试读取一次\n            // 如果第一次都读取失败，就不要启动定时器\n            bool readOk = UpdateRobotPoseDisplay(true);\n\n            if (!readOk)\n            {\n                return;\n            }\n\n            // 启动定时器\n            // 启动后，PoseTimer_Tick 会按照设定间隔自动执行\n            poseTimer.Start();\n\n            MessageBox.Show(\"已开始实时读取六轴姿态。\");\n        }\n\n        private void btnStopRealTime_Click(object sender, EventArgs e)\n        {\n            // 停止定时器\n            poseTimer.Stop();\n\n            MessageBox.Show(\"已停止实时读取六轴姿态。\");\n        }\n\n        private void toolStripLabel1_Click(object sender, EventArgs e)\n        {\n\n        }\n\n        private void toolStripMenuItem2_Click(object sender, EventArgs e)\n        {\n\n        }\n    }\n}"},{"id":"designer","name":"Form1.Designer.cs","lines":409,"role":"设计器：控件与绝对坐标","layer":"界面层","src":"namespace ABB_Digital_Twin\n{\n    partial class Form1\n    {\n        /// <summary>\n        /// 必需的设计器变量。\n        /// <\/summary>\n        private System.ComponentModel.IContainer components = null;\n\n        /// <summary>\n        /// 清理所有正在使用的资源。\n        /// <\/summary>\n        /// <param name=\"disposing\">如果应释放托管资源，为 true；否则为 false。<\/param>\n        protected override void Dispose(bool disposing)\n        {\n            if (disposing && (components != null))\n            {\n                components.Dispose();\n            }\n            base.Dispose(disposing);\n        }\n\n        #region Windows 窗体设计器生成的代码\n\n        /// <summary>\n        /// 设计器支持所需的方法 - 不要修改\n        /// 使用代码编辑器修改此方法的内容。\n        /// <\/summary>\n        private void InitializeComponent()\n        {\n            this.components = new System.ComponentModel.Container();\n            System.ComponentModel.ComponentResourceManager resources = new System.ComponentModel.ComponentResourceManager(typeof(Form1));\n            thi   private System.Windows.Forms.Label label11;\n        private System.Windows.Forms.Label label12;\n        private System.Windows.Forms.Button btnStartRealTime;\n        private System.Windows.Forms.Button btnStopRealTime;\n        private System.Windows.Forms.ContextMenuStrip contextMenuStrip1;\n        private System.Windows.Forms.ContextMenuStrip contextMenuStrip2;\n        private System.Windows.Forms.ContextMenuStrip contextMenuStrip3;\n        private System.Windows.Forms.MenuStrip menuStrip2;\n        private System.Windows.Forms.ToolStripMenuItem toolStripMenuItem2;\n        private System.Windows.Forms.ToolStripMenuItem toolStripMenuItem4;\n    }\n}"}],"blocks":{"program":[{"a":1,"b":5,"title":"文件头的 5 条 using 指令（其中 3 条是模板冗余）","brief":"引入命名空间，实际只用得上 System 和 System.Windows.Forms 两行","detail":"这五行把别的命名空间里的类型名搬进当前文件。真正用得上的只有两行——System（第 14 行 [STAThread] 特性的来源）和 System.Windows.Forms（Application、Form1 全靠它）。Collections.Generic、Linq、Threading.Tasks 是模板自动塞进来的，本文件没有泛型集合、没有 LINQ 查询、也没有 Task。↔ 对照 AbbRobotPoseReader.cs 的 8 行 using：那边每行都真在用。删掉这 3 行照样编译通过。","gotcha":"多余 using 不会产生任何编译警告，属于典型模板噪声。要确认某行是否必需，临时删掉重新生成，只有报「找不到类型或命名空间」才说明它不可删。"},{"a":6,"b":8,"title":"空行与命名空间声明","brief":"一个空行加命名空间开头，划定本文件的归属范围","detail":"第 6 行是分隔 using 区与类型声明区的空行，编译器完全忽略它，纯粹给人读。第 7 行声明命名空间 ABB_Digital_Twin，第 8 行是它的左括号。本工程 7 个文件全部落在同一个命名空间里，所以 Program、Form1、AbbRobotPoseData 互相引用不用加前缀，也不用在文件头 using 本项目。↔ 正因为共用一个命名空间，Form1.cs 里能直接写 new AbbRobotPoseData()。命名空间名带下划线虽然合法，但不符合 .NET 命名规范，属风格问题，不影响编译。"},{"a":9,"b":10,"title":"入口类的 internal + static 声明","brief":"只放 Main 的容器类，用最小暴露的修饰符","detail":"第 9 行是本块主体：internal 表示这个类只在本程序集（编出来的 exe）里可见，外部程序集看不到也无法引用；static 表示它是静态类，不能被 new、不能被继承，里面所有成员也必须是静态的。「只放一个 Main 的容器类」用这两个修饰符是最小暴露写法：没有理由让外部代码看到入口类，更没有理由创建它的实例。↔ 它在数据流最上游：第 19 行 Application.Run 把控制权交给 Form1 之后，Program 就不再参与，之后全由 Form1 的按钮和定时器驱动。","gotcha":"把 Main 挪进非 static 类、或误删这个类，编译会报 CS5001「程序不包含适用于入口点的静态 Main 方法」——根因就在这里：入口必须是静态方法。"},{"a":11,"b":15,"title":"XML 注释、[STAThread] 特性与 Main 签名","brief":"三行文档注释、单线程单元特性、以及标准入口方法签名","detail":"前三行 /// 是 XML 文档注释，编译时可选导出成 XML，供 IntelliSense 显示「应用程序的主入口点」，不参与运行。第 14 行 [STAThread] 是本块重点：它是特性，CLR 在进入 Main 之前读它，把当前线程的 COM 单元初始化成单线程单元（STA，一次只有一个线程碰该单元里的 COM 对象）。第 15 行是 C# 允许的最简入口形式，也可写 Main(string[] args) 或返回 int 当退出码。↔ Form1 的事件处理器都跑在这条 STA 线程上。","api":"[STAThread] + static void Main()（CLR 在 Application.Run 之前据此设置线程单元状态）","gotcha":"去掉 [STAThread] 程序一般仍能启动，但一旦用到 Clipboard.SetText、拖放、OpenFileDialog 或 ActiveX/COM 控件，就可能抛「当前线程不在单线程单元中」一类异常。报错点离病因很远，很难查，所以这行千万别删。"},{"a":16,"b":20,"title":"三行启动代码：视觉样式、文本渲染、消息循环","brief":"Main 的全部逻辑，顺序不可调换","detail":"Main 就三句，顺序不能换。EnableVisualStyles 打开系统视觉样式，控件按当前 Windows 主题绘制。SetCompatibleTextRenderingDefault(false) 把控件文本渲染定成 GDI（推荐值），true 则用 GDI+、与 .NET 1.x 兼容。Run 创建主窗体并启动消息循环，阻塞到主窗体关闭才返回。↔ 它进入 Form1 构造函数 → InitializeComponent → Form1_Load，之后按钮与定时器才去调 Reader。","api":"Application.EnableVisualStyles(); Application.SetCompatibleTextRenderingDefault(false); Application.Run(new Form1())","gotcha":"前两句必须在创建任何窗口之前调用，且 SetCompatibleTextRenderingDefault 每个进程只能调一次；放在窗体显示之后再调会抛 InvalidOperationException。"},{"a":21,"b":22,"title":"收尾的两行右括号","brief":"分别闭合类体和命名空间，文件到此结束","detail":"第 21 行闭合 Program 类的类体，第 22 行闭合 ABB_Digital_Twin 命名空间，分别与第 10、8 行的左括号配对。文件里没有任何业务逻辑——真正干活的是 Form1 及它持有的 Connection、Reader、DTO。↔ 值得记一笔的是 Run 的返回时机：主窗体关闭之后它才返回。将来若要写「退出前释放 Controller」这类清理代码，位置就在第 19 与 20 行之间；目前没有，所以关窗即进程退出。"}],"class1":[{"a":1,"b":5,"title":"模板自带的 5 条 using（本文件一条都用不上）","brief":"空类不需要这些命名空间，纯属 VS 新建类的默认产物","detail":"这五行全是 VS「添加 → 类」时模板自动生成的。本文件是一个完全空的类，一行代码都没用到它们，所以五行都是冗余。↔ 与本项目的 AbbRobotPoseData.cs 对比很直观：那边模板也给了同样 5 行，但 DTO 至少用到了 string 类型，需要 System；Class1 连 System 都不需要。判断某行 using 是否必要：临时删掉重新生成，报「未能找到类型或命名空间名」才说明它是必需的。保留它们不影响编译和运行，只是读代码时的噪音。","gotcha":"IDE 的「移除未使用的 using」清理会把这 5 行全删掉，行为不变——这是确认它确实没用的最快办法。"},{"a":6,"b":8,"title":"空行与命名空间声明","brief":"与其它 6 个文件共用同一个命名空间","detail":"一个空行加命名空间开头。空行只是分隔 using 区和类型声明区，编译器完全忽略。命名空间还是 ABB_Digital_Twin，与 Program.cs、Form1.cs、AbbControllerConnection.cs、AbbRobotPoseReader.cs、AbbRobotPoseData.cs 一致——本工程 7 个文件同属一个命名空间。↔ 正因如此，别的文件想引用 Class1 时不需要再加 using，这也是它「悄悄存在、没人注意」的原因之一。第 8 行左括号与第 12 行右括号配对。"},{"a":9,"b":10,"title":"空类 Class1 的声明","brief":"internal 的空类，没有任何成员，从未被 new 过","detail":"空类声明本身。第 9 行把类名定为 Class1、可见性定为 internal（程序集内可见），第 10 行是类体左括号。这个类里没有任何成员：没有字段、没有属性、没有方法、没有构造函数、没有事件。它是「新建类」的原始模板，创建后从未被修改过。↔ 关键事实：整个工程里没有一处 new Class1()，也没有任何地方把它当类型使用，所以它是死代码；但它并非不存在——它会被编译进 exe 的程序集（多一个类型条目），只是永远不会被实例化。删掉这个文件对程序行为零影响。","gotcha":"留着一个从不使用的空类不会报错也不会警告，容易被误以为是某个功能的占位；接手别人的工程时，先用「查找所有引用」确认它真没人用，再决定删不删。"},{"a":11,"b":12,"title":"两行收尾右括号","brief":"闭合类体与命名空间，文件结束","detail":"两行右括号收尾：第 11 行闭合 Class1 的类体，第 12 行闭合 ABB_Digital_Twin 命名空间。它们分别与第 10 行、第 8 行的左括号配对。↔ 这个文件到此结束，它对数据流（按钮/定时器 → Connection → Reader → DTO → Form1 显示）没有任何贡献：既不在 Program.Main 的调用链上，也不在 Form1 的引用链上。保留它的唯一作用，是让项目文件列表看起来更像 VS 默认模板；如果目标是理解整个工程，这个文件可以直接跳过。"}],"pose":[{"a":1,"b":5,"title":"模板自带的 5 条 using（只依赖基础类库）","brief":"纯数据类有意不引入任何 PCSDK 命名空间","detail":"这五行同样是 VS「添加 → 类」模板自动生成的。对这个纯数据类来说，真正有点关系的只有 System，其余四行完全用不到：没有集合、没有 LINQ 查询、没有 StringBuilder、没有异步代码。↔ 对照 AbbRobotPoseReader.cs：它用了 Controller、MechanicalUnit、JointTarget，必须再补三行 ABB 命名空间的 using；而 DTO 有意只依赖 BCL，不引入任何 PCSDK 类型——这正是它能当中立数据契约的原因。","gotcha":"若将来给 DTO 加上 List<double> 之类的成员，Collections.Generic 就变成必需的了；这些残留 using 有时是提前预支进来的。"},{"a":6,"b":8,"title":"空行与命名空间声明","brief":"DTO 放在命名空间顶层，三层都能引用它","detail":"空行加命名空间声明。命名空间是 ABB_Digital_Twin，与 Program.cs、Form1.cs、Reader 完全一致，所以 Form1 里用 out 参数拿到 AbbRobotPoseData 时不需要任何额外 using。↔ 第 8 行左括号与第 29 行右括号配对，中间只有这一个类。注意：DTO 故意放在普通命名空间顶层而不是嵌套在 Form1 里，这样设备层 Connection、数据层 Reader、UI 层 Form1 三方都能引用它，而它不反过来依赖任何一层——这是分层能成立的前提。"},{"a":9,"b":10,"title":"类声明：public 的纯数据容器","brief":"public 是为了当对外数据契约，类体里只有属性","detail":"类的声明。public 表示任何程序集都能看到并使用这个类型；虽然本项目只有 Form1 和 Reader 在用，且它们与 DTO 同程序集（internal 也够），但 DTO 的定位是对外暴露的数据契约，写 public 更符合惯例，也方便将来把数据层拆成独立类库。名字后缀 Data 是 DTO 的常见命名。↔ 它是三层里最底层：Reader 负责 new 并填值，Form1 负责读取，它自己完全不知道上下游是谁。这就是 POCO 的价值：不写逻辑，所以谁都能用、改动影响面最小。","gotcha":"把计算逻辑（比如毫米转米、四元数转欧拉角）写进 DTO，会立刻让它依赖具体数据来源和显示需求，三层就粘在一起了；转换要放在读取侧或显示侧。"},{"a":11,"b":16,"title":"六个关节角属性 J1~J6（唯一被显示的六个字段）","brief":"自动属性，装 Reader 从 RobJoint 抄来的六轴角度","detail":"六个关节角属性，都是 public double 配「get; set;」自动属性。自动属性是语法糖：编译后字段和 get/set 方法都在，只是源码里省了。↔ 上游是 Reader 第 47~52 行把 Rax_1..Rax_6 赋过来；下游是 Form1 第 149~154 行用两位小数显示到 txtJ1~txtJ6。所以 14 个属性里只有这 6 个真正被读取。注意 float 转 double 只是换了更宽的容器：Rax_* 本身是 float（约 7 位有效数字），装进 double 不会变准。","api":"RobJoint.Rax_1 ... Rax_6（float）；JointTarget.RobAx（public 字段，非属性）","gotcha":"若当前活动机械单元是外轴或变位机，MechanicalUnit.GetPosition() 会把角度塞进 ExtAx，RobAx 全 0，于是这六个值静默显示 0.0000，而读取方法的返回值仍然是 true。"},{"a":17,"b":20,"title":"TCP 平移三分量 TcpX/TcpY/TcpZ（读到了但没人看）","brief":"世界坐标系下的 TCP 位置，单位 mm，下游零读取","detail":"TCP 平移三个分量。第 17 行空行只是分组。单位是毫米：PCSDK 内部 GetCurrentTarget 做的是 cartesianValues[0] 乘以 1000，控制器内部用米，暴露到 .NET 端已换成 mm。↔ 上游 Reader 第 54~56 行从 robTarget.Trans.X/Y/Z 赋值，取的是 World 世界坐标系下的位姿。下游：没有——Form1 从头到尾没读过这三个属性，设计器里也没做 TCP 显示框。于是它们「读到了、存下来了、没人看」，而这恰是数字孪生最需要的部分。","api":"MechanicalUnit.GetPosition(CoordinateSystemType) → RobTarget.Trans（float X/Y/Z，单位 mm）","gotcha":"界面只显示关节角，容易让人误以为 PCSDK 只拿得到关节角；实际上 TCP 位姿每 500ms 都已读进内存，加三个 TextBox 绑定即可显示，不需要新增任何 PCSDK 调用。"},{"a":21,"b":25,"title":"四元数姿态四分量 Q1~Q4（读到了但没人看）","brief":"从 Orient 抄来的四个分量，同样只有赋值没有读取","detail":"四元数姿态四分量，同样只赋值不读取。上游是 Reader 第 58~61 行从 robTarget.Rot.Q1..Q4 抄过来。↔ 与 TCP 一样，Form1 没有任何地方读它们，界面上的姿态信息完全缺失。真要显示会遇到顺序陷阱：Orient 里 Q1 是标量部分 w，Q2/Q3/Q4 才是向量部分 x/y/z；而 .NET 的 Quaternion 构造顺序是 x,y,z,w，直接按 Q1~Q4 构造会得到转错的姿态。Orient 自带 ToEulerAngles，显示欧拉角不必自己推公式（单位未验证）。","api":"Orient.Q1..Q4（double）；Orient.ToEulerAngles(out double, out double, out double)","gotcha":"别把 Q1~Q4 当成 x/y/z/w 直接用；顺序搞反的典型症状是「姿态看着像，但差一个旋转变换」，很难一眼看出来。"},{"a":26,"b":29,"title":"机械单元名属性与两行收尾括号","brief":"string 属性可为 null，闭合类体与命名空间","detail":"机械单元名属性加两行收尾的右括号。MechanicalUnitName 是 string、引用类型，用来记录这份数据取自哪个机械单元，调试时最有用。↔ 上游 Reader 第 45 行写 poseData.MechanicalUnitName = mechUnit.Name；下游同样是零读取——Form1 没显示它，所以出错时你无法从界面判断是哪个单元的数据。结合事实卡那条：若活动单元是外轴导致关节角全 0，这里恰好就是最该看的信息，却被丢掉了。","gotcha":"string 是引用类型，未赋值时默认是 null（double 才会自动是 0.0）；本类每次读取都 new 一个新对象再由 Reader 立即赋值，实际不会是 null，但类型上允许，读之前判空更稳。"}],"reader":[{"a":1,"b":9,"title":"文件头与命名空间导入","brief":"九个 using，决定后面能写哪些短名字","detail":"这九行决定本文件后面能直接写哪些短名字：前五行是 .NET 基础命名空间（Exception、集合、LINQ、字符串、异步任务），后三行是 PCSDK 的三个域——Controllers 核心域、MotionDomain 运动域、RapidDomain 数据结构域。真正用到的只有 System 和后两个 ABB 域，中间几行是新建类的模板残留，删掉也不影响行为。↔ 后面 Controller、JointTarget 能不能省全名，全由这几行决定。","gotcha":"中间几个 using 一次都没用到，别误以为它们在起作用；删掉也不会报错。"},{"a":10,"b":13,"title":"命名空间与类声明","brief":"把读姿态这件事封成一个可复用的小类","detail":"ABB_Digital_Twin 是整程序的命名空间，七个源文件都住这里，所以 Form1 不用写全名就能 new 出这个类。AbbRobotPoseReader 是无状态工具类：没有字段、没有构造函数、不持有 Controller，唯一成员就是下面的 ReadRobotPose，因此在 Form1 里 new 几次都不会残留上一次的状态。↔ 上游是 Form1 的 poseReader 成员，下游是本类唯一方法；本类产出的对象类型是 DTO AbbRobotPoseData。","gotcha":"类里不存 Controller，所以每次调用都必须由调用方把控制器递进来。"},{"a":14,"b":18,"title":"方法签名与两个 out 参数初始化","brief":"输入一个控制器，输出姿态数据 + 一句提示语","detail":"签名三样东西：输入 controller、输出 poseData、输出 message，返回值 bool 只表达成败。这是典型的「状态码 + 消息」C 风格约定：失败原因不抛异常，而是写进 message 让 UI 弹窗，让“没连接”这类常态失败不炸界面。out 要求被调方在每条返回路径上先赋值，调用方反而可以传未初始化变量——Form1 里那句 AbbRobotPoseData poseData; 正因此才编得过。↔ 下游是 Form1.UpdateRobotPoseDisplay。","api":"bool ReadRobotPose(Controller controller, out AbbRobotPoseData poseData, out string message)","gotcha":"out 参数不允许只在成功路径赋值：任何一条 return 之前漏赋值都编译不过。"},{"a":19,"b":26,"title":"try 包裹与控制器空引用检查","brief":"先判定控制器在不在，再进保护区","detail":"try 从第 19 行一直开到第 65 行，把后面全部 PCSDK 调用圈进异常保护区。里面第一件事是防 controller 为 null——用户没点连接就点读取，这时没必要进网络层，直接给一句人话并返回 false。注意这个检查只防 null，防不了\"对象还在但控制器已断开\"，那种情况只有真正发 RPC 时才炸，由第 66 行的 catch 兜住。↔ 上游是 Form1 直接把可能为 null 的 abbService.CurrentController 递进来。","gotcha":"null 检查挡不住\"已断开\"：对象非空但链路已死，只有真调用时才抛异常。"},{"a":27,"b":29,"title":"取当前活动机械单元","brief":"向运动系统要「当前激活」的那一台单元","detail":"向运动系统要当前激活的机械单元。ActiveMechanicalUnit 最省事也最片面：单机器人站够用，带外轴、变位机或双机的系统里它只返回控制器认定的那一台，其余完全看不到，要遍历得用 MotionSystem.MechanicalUnits，本程序没写。反编译显示它每次访问都要比对 InternalController.Motion.ActiveMech，可能带一次控制器往返，不适合塞进 500ms 定时循环。↔ 下游第 37、41 行两次 GetPosition 都挂在它上面。","api":"MechanicalUnit MotionSystem.ActiveMechanicalUnit","gotcha":"只返回当前激活的一台，多机或带外轴系统会漏掉其它机械单元。"},{"a":30,"b":35,"title":"机械单元空值检查","brief":"没有激活单元时给出专用提示，而不是让它炸","detail":"控制器在线但系统里没有激活机械单元时，上一行会返回 null；不拦一下，第 37 行就 NullReferenceException，再被 catch 压成一句含糊的\"读取失败\"，用户分不清是没激活还是网络断。这里显式判 null 并返回专用提示语，是全方法唯一把\"没激活单元\"和\"RPC 失败\"区分开的检查，诊断价值就靠它。↔ 上游是第 28 行属性的返回值，下游回 Form1：定时器路径 showErrorMessage 传的是 false，这类提示不会弹窗，界面只会静默停在旧数字上。","gotcha":"定时器路径不弹窗，这条提示等于只写不用，用户只看到数字不动。"},{"a":36,"b":39,"title":"读取六轴关节角","brief":"拿 JointTarget，只取机器人本体那半边 RobAx","detail":"无参重载拿到 JointTarget，再只取其中的 RobAx（本体六轴）。GetPosition() 内部按单元类型分流：TcpRobot 型把关节值放进 RobAx、ExtAx 给 Empty；外轴或变位机型反之，值全塞进 ExtAx，RobAx 变成 RobJoint.Empty（六个 0），且不抛异常。代码从不看 ExtAx，于是带变位机的站上 J1~J6 静默显示 0.0000 而 readOk 仍为 true。Rax_1..Rax_6 是 float，单位度。↔ 下游是第 47~52 行摊平进 DTO。","api":"JointTarget MechanicalUnit.GetPosition()","gotcha":"外轴/变位机型下 RobAx 是 RobJoint.Empty（全 0），代码不判 ExtAx，J1~J6 静默显示 0 而 readOk 仍是 true。"},{"a":40,"b":42,"title":"读取 TCP 位姿（世界坐标系）","brief":"换一个重载，问世界系下的笛卡尔位姿","detail":"第二次 GetPosition 换成带参重载，指定 World 世界坐标系，拿回 RobTarget。它由 Trans（Pos 型 X/Y/Z，毫米）、Rot（Orient 四元数）、Robconf（轴配置）、Extax（外轴）组成，本程序只用前两个。CoordinateSystemType 还有 Base、Tool、WorkObject 等选项。该重载只支持 TcpRobot 型单元，其它类型抛异常；它又在第 37 行之后同一 try 里，一抛就把已读关节角一起废掉。↔ 下游是第 54~61 行写 DTO。","api":"RobTarget MechanicalUnit.GetPosition(CoordinateSystemType coordinateSystem)","gotcha":"只支持 TCP Robot 型单元；它排在关节角读取之后、同一 try 内，抛异常会把已成功的关节角结果一并废掉。"},{"a":43,"b":46,"title":"创建 DTO 并写入单元名","brief":"两次读取都成了，才分配 DTO 开始摊平","detail":"两次读取都越过之后，才 new 一个 AbbRobotPoseData，把 PCSDK 的嵌套结构摊平成纯数据类。摊平的意义是解耦：Form1 从此不必认识 JointTarget、RobTarget、Orient，只面对 14 个 double 加 1 个 string；将来换 SDK 版本或加缓存层只改本文件。不过第 45 行写的 MechanicalUnitName 全程序无人读取，是预留没接上的死字段。↔ 下游 Form1.UpdateRobotPoseDisplay 只消费 J1~J6。","gotcha":"MechanicalUnitName 与 TcpX/Y/Z、Q1~Q4 一样，有赋值无读取，属死字段。"},{"a":47,"b":53,"title":"把六轴角度写进 DTO","brief":"Rax_1..Rax_6 逐行搬到 J1..J6","detail":"六行一一对应，把 robJoint 的 Rax_1..Rax_6 搬到 DTO 的 J1..J6。float 赋给 double 属性会自动加宽、不报错，但也带不来额外精度——源头就是 float，约七位有效数字就到头。单位是度，和示教器、RAPID 里的 deg 完全一致，中间没有任何弧度换算，将来喂给运动学库或三维引擎得自己转。这六个字段是 DTO 里唯一真正被界面消费的数据。↔ 下游 Form1 用 ToString(\"F2\") 刷到 txtJ1~txtJ6，精度再高也只看到两位小数。","gotcha":"源头是 float、显示是 F2，想凭界面数字反推精度会误判。"},{"a":54,"b":62,"title":"写 TCP 位置与四元数姿态","brief":"摊平 Trans 三个数和 Rot 四个数","detail":"七行把 RobTarget 的两个子结构摊平：Trans.X/Y/Z 是 TCP 位置，单位毫米（PCSDK 内部把控制器的米乘 1000 换成毫米）；Rot.Q1~Q4 是姿态四元数。四元数顺序是本块最大的坑：ABB 的 Q1 是标量 w、Q2~Q4 是 x/y/z，而 .NET Quaternion 的构造顺序是 (x, y, z, w)，照原序搬运姿态会整个错。Orient 另带 ToEulerAngles，要显示欧拉角直接调。↔ 这七个字段目前没有下游消费者。","api":"Orient.ToEulerAngles(out double x, out double y, out double z)","gotcha":"Q1 是标量 w、Q2~Q4 是 x/y/z，与 .NET Quaternion(x,y,z,w) 顺序相反，照抄顺序姿态会错。"},{"a":63,"b":70,"title":"成功返回与失败兜底","brief":"写提示语 + return true，或 catch 后拼 ex.Message","detail":"成功路径写一句中文提示再 return true；失败路径把异常压成“读取机器人姿态失败：”加 ex.Message 再 return false。两点值得注意：成功串目前没有消费者——调用方只在 !readOk 时 MessageBox.Show(message)；而只取 ex.Message 等于丢诊断信息，PCSDK 会把底层 RPC 异常再包一层，真正的 HResult 和 InnerException 全被吞掉。↔ 下游是 Form1 的弹窗与 txtJ1~txtJ6 刷新。","gotcha":"只取 ex.Message：PCSDK 包了一层的底层异常（InnerException / HResult）全丢。"},{"a":71,"b":74,"title":"方法与类收尾","brief":"四层右括号逐级闭合","detail":"四个右括号逐层收口：第 71 行闭合 ReadRobotPose 方法，第 72 行闭合 AbbRobotPoseReader 类，第 74 行闭合 ABB_Digital_Twin 命名空间，中间的 73 行是带空格的空行。这一块没有逻辑，却是判断括号归属的唯一依据——方法内有 try 和多层 if 嵌套，数括号容易出错。↔ 闭合后本文件对外只有 ReadRobotPose 一个入口，Form1 靠它拿 DTO。","gotcha":"第 73 行是带空格的空行，肉眼像空行，做文本比对或行数统计时容易误判。"}],"conn":[{"a":1,"b":8,"title":"using 区：基础库 + 两个 PCSDK 命名空间","brief":"引入 System 与泛型集合，并把 ABB 的控制器域、发现域拉进来","detail":"前 5 行是模板默认项，只用到 System 和 System.Collections.Generic，其余是残留。要紧的是第 6、7 行：Controllers 命名空间提供 Controller、ControllerFactory、ControllerInfo、UserInfo；Discovery 提供 NetworkScanner 与 ControllerInfoCollection。↔ 下游即扫描用 NetworkScanner、建连用 ControllerFactory、属性类型用 Controller。","api":"ABB.Robotics.Controllers (Controller / ControllerFactory / ControllerInfo / UserInfo)；ABB.Robotics.Controllers.Discovery (NetworkScanner / ControllerInfoCollection)"},{"a":9,"b":12,"title":"命名空间与 internal 类声明","brief":"给设备层类安家，限定它只在程序集内可见","detail":"第 9 行声明命名空间 ABB_Digital_Twin，第 11 行定义类 AbbControllerConnection，internal 只在本程序集可见。这是设备层：只做扫描、连接、断开，不碰界面、不解析位姿。↔ 上游 Form1 持有它并调 ScanControllers / ConnectFirstController / DisconnectController；下游经 CurrentController 把 Controller 交给 AbbRobotPoseReader。未连接即 null。","gotcha":"类本身没实现 IDisposable：连接的最后释放依赖 Form1_FormClosing 主动调 DisconnectController，若进程被强杀或有别的退出路径，Logoff 不会发出，控制器侧的匿名登录要等超时才释放。"},{"a":13,"b":17,"title":"两个私有字段：连接对象与扫描结果缓存","brief":"controller 是能说话的连接，controllerList 是一串名片","detail":"第 14 行是当前连接，null 表示未连接；第 17 行是扫描结果缓存，元素是 ControllerInfo。两者必须分清：ControllerInfo 只是广播里拿到的名片——IP、系统名、控制器名、版本，读不了关节角；Controller 才是能发 RPC 的连接对象。↔ 上游：controllerList 由 ScanControllers 填、被 ConnectControllerByIndex 取用；controller 由它赋值、被 DisconnectController 置 null。","api":"ABB.Robotics.Controllers.Controller；ABB.Robotics.Controllers.ControllerInfo","gotcha":"把 Controller 与 ControllerInfo 混用是最常见的坑：CreateFrom(info) 之前拿 Info 做任何读取都不行；Logon 之后 Info 里的信息又已经过时（控制器可能已经换过系统）。"},{"a":18,"b":29,"title":"两个只读属性：CurrentController 与 ControllerCount","brief":"只给 get，外部读得到但换不了引用","detail":"第 20~23 行暴露当前连接，第 26~29 行暴露扫描数量。两者都只有 get：建连与销毁必须全走 ConnectControllerByIndex / DisconnectController，若外部能赋值就会出现「属性非空但没 Logon」「旧对象没 Dispose 就被换掉」的错配。↔ 上游 Form1.button2_Click 用 ControllerCount == 0 决定要先扫；UpdateRobotPoseDisplay 把 CurrentController 传给 Reader。","gotcha":"CurrentController 返回的是内部字段本身（引用），调用方虽不能替换引用，却可以对它调 Logoff()/Dispose()，从而绕开本类的状态管理。要彻底防护得返回受限包装。"},{"a":30,"b":65,"title":"ScanControllers：清缓存 → 广播发现 → 转存 → 报结果","brief":"同步阻塞地扫局域网，把名片集合复制进自己的 List","detail":"四步：controllerList.Clear() 清掉上次结果防重复；new NetworkScanner() 造扫描器；scanner.Scan() 真正扫描；把 scanner.Controllers（ControllerInfoCollection，不是 List）用 foreach 搬进自己的 List。扫不到或抛异常都返回 false 并给中文提示。↔ 上游 Form1.button1_Click 调它并弹 message，随后调 GetControllerDisplayLines 刷 ListBox。","api":"NetworkScanner.Scan()；NetworkScanner.Controllers → ControllerInfoCollection","gotcha":"反编译可见 Scan() 内部是 Internal.NetworkScanner.Instance.GetControllers() 再拷进 _controllers，全程同步、通常数秒；它被按钮事件在 UI 线程上直接调用，所以扫描期间窗口就是「未响应」，不是死机。另外 PCSDK 自带 NetworkScanner.AddRemoteController(string address) 可手工指定 IP / 跨网段，本程序一次都没调用——跨网段或广播被防火墙挡掉的现场永远扫不到。"},{"a":66,"b":95,"title":"GetControllerDisplayLines：把名片摊成可显示的文本行","brief":"设备层只组织文本，怎么显示交给 UI 层","detail":"没扫到控制器时返回两条提示语并早退；扫到了按 index 从 1 开始，每台固定拼 7 行：分隔线、IP、系统名、RobotWare 版本、控制器名、是否虚拟、一个空字符串。为何返回 List<string> 而不直接写 ListBox？本类是设备层，引用 System.Windows.Forms 就把两层焊死。↔ 上游 Form1.button1_Click 拿到后 foreach 逐行 Add 进 listBox1；数据来自上一块填好的 controllerList。","api":"ControllerInfo.IPAddress (System.Net.IPAddress)；ControllerInfo.SystemName；ControllerInfo.Version (System.Version)；ControllerInfo.ControllerName；ControllerInfo.IsVirtual","gotcha":"列表布局本身就是坑：每台控制器占 7 个 ListBox 条目，还含一个空字符串条目。所以 listBox1.SelectedIndex 绝不能直接当控制器索引，要用 SelectedIndex / 7；而空条目既能被鼠标选中、又会让除法算错。当前靠 ConnectFirstController 固定连第 0 台，隐患未暴露；一旦改成「选中哪台连哪台」就必须重做映射（例如把 ControllerInfo 直接绑列表 + DisplayMember，或干脆不给空行）。"},{"a":96,"b":101,"title":"ConnectFirstController：一行转调的包装方法","brief":"把「连第一台」变成有名字的入口，内部转调带索引的实现","detail":"方法体只有一句 return ConnectControllerByIndex(0, out message);，索引写死 0。薄包装的价值在名字与变化点：调用方写 ConnectFirstController 语义更清楚，将来支持「手工 IP」「连选中项」时只改这一处，Form1.button2_Click 不用动；out 可原样下传。↔ 上游是 Form1.button2_Click（随后 MessageBox.Show(message)）；下游是 ConnectControllerByIndex。","gotcha":"写死 0 意味着用户无法选择连哪台：现场有两台以上控制器时只能连扫描顺序里的第一台，而这个顺序由 netscan 决定、并不稳定。"},{"a":102,"b":151,"title":"ConnectControllerByIndex：两道防御 + 断旧建新 + 匿名登录","brief":"校验下标、清旧连接、CreateFrom 建对象、Logon 登录、拼提示","detail":"顺序不能乱：先挡「列表为空」「下标越界」；取名片；DisconnectController() 清旧连接；ControllerFactory.CreateFrom(info) 造对象；Logon(UserInfo.DefaultUser) 才真正联网；成功用加号拼 4 行中文消息。失败路径必须显式 Dispose 再置 null。↔ 上游 Form1.button2_Click 弹出 message 后定时器才读位姿；下游是 ControllerFactory、Logon、UserInfo。","api":"ControllerFactory.CreateFrom(ControllerInfo info)；Controller.Logon(UserInfo user)；UserInfo.DefaultUser","gotcha":"三处坑：①反编译里 CreateFrom 只是 new Controller(FormatControllerId(info.SystemId))，不联网，不能拿它当连接成功判据；②这里说的「连接成功」实质只是 Logon 成功——控制器同一时刻只认一个用户（mastership），示教器占着时 Logon 会失败，即便成功也不代表能读位姿；③catch 只取 ex.Message，PCSDK 常把底层 RPC 异常再包一层，真原因留在 InnerException 里被丢掉。"},{"a":152,"b":175,"title":"DisconnectController：幂等断开 + finally 复位","brief":"先 Logoff 让出 mastership，再 Dispose，最后无论如何置 null","detail":"结构是 if 判空 + try { Logoff; Dispose; } catch { } finally { controller = null; }。if 让方法幂等：关窗调一次、建连前又调一次都不会崩。顺序有意义：Logoff 先发 RPC 让出 mastership，Dispose 再释放本地连接与订阅；finally 置 null 是状态一致性的唯一保证。↔ 上游 Form1_FormClosing 与 ConnectControllerByIndex。","api":"Controller.Logoff()；Controller.Dispose()","gotcha":"空 catch 会把断连失败彻底吞掉：控制器已关机或断网时 Logoff 抛异常，程序不留任何痕迹，事后查不到「这次到底退没退出登录」。取舍是关程序时不该再弹框，但至少该 Debug.WriteLine 一行留证。另外 finally { controller = null; } 不可挪到 try 末尾——Logoff 一抛就跳过它，字段留着半死对象，CurrentController 就谎报「还连着」。"}],"form":[{"a":1,"b":10,"title":"文件头的 using 清单","brief":"新建 WinForms 项目时自动生成的模板，一半没用上","detail":"这十行是新建 WinForms 项目自动生成的 using 模板。本文件真用到的只有 `System`（`EventArgs`）、`Collections.Generic`（`List<string>`）、`Windows.Forms`（`Form`/`MessageBox`/`Timer`），其余六个都没用上。↔ 下三层的类型都在同一命名空间，不写 using 也能互相引用；第 10、11 行是连续两行空行，不是排错。"},{"a":11,"b":15,"title":"命名空间与类声明：partial 是什么","brief":"Form1 只是这个类的两半之一，另一半在 Designer.cs","detail":"把 `Form1` 声明成命名空间里的 `partial class` 并继承 `Form`。`partial` 是编译期合并：本文件写逻辑，`Form1.Designer.cs` 写控件与 `InitializeComponent()`，两半私有成员互见——所以这里能直接写 `txtJ1.Text`，而它声明在 Designer 第 383 行。↔ 上游 Designer 的事件接线（如第 76 行接 `button1_Click`），下游是第 16~18 行三个字段。"},{"a":16,"b":18,"title":"三个字段：两个协作者 + 一个定时器","brief":"组合而非继承，UI 层只做调度","detail":"`abbService`（设备层）和 `poseReader`（数据层）是 new 出来的字段，Form1 持有而不继承，UI 只剩调度职责；两个都没写修饰符，类成员默认 `private`。第三个 `poseTimer` 特意写全名：`System.Threading.Timer` 回调在线程池线程上，改控件必抛跨线程异常；WinForms 版靠 WM_TIMER 驱动，`Tick` 天生在 UI 线程。↔ 下游是 `ScanControllers` 与 `ReadRobotPose`。","gotcha":"用错 Timer 类型（`System.Threading.Timer` 或 `System.Timers.Timer`）会让 `Tick` 在非 UI 线程执行，碰控件必抛跨线程异常。"},{"a":19,"b":33,"title":"构造函数：控件创建 + 定时器配置 + 事件订阅","brief":"new Form1() 时跑一次，四件事一次做完","detail":"构造函数四件事：`InitializeComponent()` 造控件、`Interval = 500` 定节拍、`Tick += PoseTimer_Tick` 挂事件、`FormClosing += Form1_FormClosing` 挂清理。500ms 即每秒 2 次；`Interval` 只是精度上限，单次读取耗时会把实际周期拉长，所以注释建议稳定后再降到 200。↔ 上游 `Application.Run(new Form1())`；下游第 32 行与 Designer 第 367 行的重复订阅。","gotcha":"`FormClosing` 在本文件第 32 行和 Form1.Designer.cs 第 367 行各订阅了一次，关闭窗口时 `Form1_FormClosing` 会连跑两遍；目前只因逻辑幂等才没出事，应删掉其中一处。"},{"a":34,"b":52,"title":"PoseTimer_Tick：每 500ms 读一次，失败停表并弹框","brief":"轮询入口，成败都在这里收口","detail":"每 Tick 调 `UpdateRobotPoseDisplay(false)` 读一次；返回 false 就 `poseTimer.Stop()` 再弹模态 `MessageBox`。毛病在『用弹窗做错误通道』：`Show` 自带模态消息循环，窗口被冻到用户点确定；现场没人时程序就停在这个框上，读数不更新也没重试出口。好在第 48 行先 Stop 后 Show，不会自己叠出第二层框。↔ 上游构造函数第 29 行；下游 `ReadRobotPose`。","gotcha":"模态弹框代替状态显示：无人在位时程序永久停在对话框上，读数停滞且界面无响应。"},{"a":53,"b":73,"title":"button1_Click：扫描控制器（同步阻塞）","brief":"清列表 → 扫描 → 无视成败都填列表 → 失败才弹框","detail":"流程：清空 `listBox1` → `ScanControllers(out message)` → 把 `GetControllerDisplayLines()` 的行无条件填进列表 → 只有 `scanOk == false` 才弹框。0 台时该函数自己返回两行提示，于是失败时列表有内容、又弹一个框，同一件事说两遍。扫描是广播发现，同步阻塞数秒且跑在 UI 线程，界面必然假死。↔ 下游 `AbbControllerConnection.ScanControllers`。","api":"NetworkScanner.Scan()","gotcha":"扫描期间没有禁用按钮；同步扫描跑在 UI 线程上，窗口重绘和点击全部停顿（假死）。"},{"a":74,"b":93,"title":"button2_Click：连接控制器","brief":"固定连第 0 台，完全忽略列表选中项","detail":"先看 `ControllerCount == 0` 就自动补扫一次，失败则弹框并 `return`；然后无条件 `ConnectFirstController`，最后不管成败都 `Show(message)`，成功失败靠文字区分而非返回值。问题：它内部就是 `ConnectControllerByIndex(0, ...)`，`SelectedIndex` 一次没读，选第 2 台仍连第 1 台；`connectOk` 也没用。↔ 下游 Connection 三个方法。","api":"ControllerFactory.CreateFrom(ControllerInfo info); Controller.Logon(UserInfo user)","gotcha":"连接固定取索引 0，忽略 `listBox1.SelectedIndex`，现成的 `ConnectControllerByIndex` 没被调用；且只要 `ControllerCount` 非 0 就跳过重扫，可能连到很久以前扫出的旧列表。"},{"a":94,"b":103,"title":"Form1_FormClosing：关窗清理","brief":"先停轮询，再断连接，顺序不能反","detail":"两行有效代码，顺序是关键：先 `poseTimer.Stop()` 再 `DisconnectController()`。若先断连接而定时器还活着，下一个 Tick 就拿着已 `Dispose` 的 Controller 去读——轻则异常冒到 WinForms 全局未处理对话框，重则卡在同步调用里让窗口关不掉。先停表等于先关掉唯一会碰 Controller 的定时源。↔ 上游两处订阅；下游 Connection 的断开方法。","api":"Controller.Logoff(); Controller.Dispose()"},{"a":104,"b":108,"title":"button3_Click：单次读取","brief":"传 true，失败就弹框","detail":"三行方法：调 `UpdateRobotPoseDisplay(true)` 后把返回值丢掉。传 `true` 是它和 Timer 那条路唯一区别——用户手点按钮时正盯着屏幕，愿意为一次失败付一个弹框；Timer 传 `false`，由 Tick 自己决定弹不弹。返回值被丢弃，所以『这次没读到』除了弹框没有任何痕迹。↔ 上游 Designer 第 111 行；下游第 120 行核心方法。"},{"a":109,"b":133,"title":"核心方法签名与『设备层 → 数据层』交接","brief":"showErrorMessage 开关 + 三个 out 实参","detail":"`UpdateRobotPoseDisplay(bool showErrorMessage)` 是全程序唯一的『DLL 数据→界面文本』入口，全文件只两处调它（Tick 传 false、按钮传 true）。先声明 `poseData`、`message` 再作为 `out` 实参交给 `ReadRobotPose(abbService.CurrentController, ...)`：`out` 由语言保证被调方正常返回时必已赋值，所以不必初始化。这一行是两个分层的接缝。↔ 下游 Reader。","api":"MechanicalUnit.GetPosition(); MechanicalUnit.GetPosition(CoordinateSystemType.World)","gotcha":"Reader 内部把关节角和笛卡尔两次 `GetPosition` 放在同一个 try 里，笛卡尔那次对非 TcpRobot 单元会抛异常，结果把已经读到的关节角也一起判成失败。"},{"a":134,"b":157,"title":"失败弹窗与 J1~J6 落屏","brief":"唯一显示通道：只写了 6 个 TextBox","detail":"失败分支：只有 `showErrorMessage == true` 才弹 `message`，然后返回 false，好让 Tick 那条路自己控制提示时机。成功分支把 J1~J6 用 `ToString(\"F2\")` 写进 6 个 TextBox 后返回 true——显示到此为止。`F2` 是定点两位小数（不是两位有效数字），小数点符号随 `CultureInfo` 变。DTO 里 TCP、四元数、单元名都赋了值却没人读。↔ 上游 Reader；下游 `txtJ1..txtJ6`。","api":"RobJoint.Rax_1..Rax_6 (float); RobTarget.Trans.X/Y/Z (mm)","gotcha":"若当前活动机械单元是外轴（MultiAxes/SingleAxis），`GetPosition()` 把角度塞进 `ExtAx`、`RobAx` 全 0，这里会安静地显示 0.00 而 `readOk` 仍为 true。"},{"a":158,"b":162,"title":"Form1_Load：空的事件处理","brief":"挂着但一行逻辑都没有","detail":"方法体是空的，什么都不做。Designer 第 368 行确实还挂着 `this.Load += new System.EventHandler(this.Form1_Load)`，所以它不是没人引用的野方法，但它也确实没有一行逻辑：既不初始化界面、不预连接控制器、也不读配置。这种『挂着但空』的处理方法最容易让人误以为『初始化已经做过了』。↔ 上游 Designer 的 `Load` 订阅；下游无。"},{"a":163,"b":180,"title":"btnStartRealTime_Click：启动轮询","brief":"先试读一次，读得到才启动定时器","detail":"顺序是对的：先 `UpdateRobotPoseDisplay(true)` 手动读一次（失败会弹具体原因），读不到就 `return` 不启动定时器——避免刚起步就每 500ms 失败刷屏；读到才 `Start()`。最后那句『已开始』是纯提示，弹在 `Start()` 之后：模态框一挡住界面，第一屏读数就过时了。`Start()` 幂等，重复点不叠加节拍。↔ 上游 Designer 第 273 行；下游 `Start()` 与 Tick。","gotcha":"没有『是否已在运行』的判断：重复点『开始』会再试读一次并再弹一次提示；启动提示框弹在 `Start()` 之后，形同装饰。"},{"a":181,"b":188,"title":"btnStopRealTime_Click：停止轮询","brief":"停表 + 一句提示，但没有状态复位","detail":"`poseTimer.Stop()` 停表，再弹『已停止』。停下来的效果只是 Tick 不再触发，界面上的 J1~J6 保留最后一次的值原样不动——没清空、没置灰，看不出是历史值还是实时值，这是实时监控界面常见的坑；正规做法是停表时给个状态标识，比如标题加『已停止』。重复 `Stop()` 无害。↔ 上游 Designer 第 285 行；下游与 Tick 里失败停表同一句。"},{"a":189,"b":198,"title":"两个空方法：死代码与调试残留","brief":"toolStripLabel1 控件已经不存在了","detail":"`toolStripLabel1_Click` 对应的控件在 `Form1.Designer.cs` 里根本没声明（全文搜不到 `toolStripLabel1`），是没人调用的孤儿方法；编译能过只因为它是普通方法。`toolStripMenuItem2_Click` 倒是真接了线（Designer 第 323 行），挂在菜单项『12231』上，点了什么都不发生，明显是调试残留。删掉这两个方法不影响行为。↔ 上游 Designer 第 323 行；下游无。","gotcha":"菜单文字『12231』『12121』是明显的调试残留，交付前应整段删掉。"},{"a":199,"b":200,"title":"收尾：闭合类与命名空间","brief":"两个右括号，顺带看全文件的异常策略","detail":"第 199 行闭合 `partial class Form1`，第 200 行闭合 `namespace ABB_Digital_Twin`。顺带点一件全文件级的事：这里从头到尾没有一个 `try/catch`——异常全靠下两层各自兜住（Connection 的扫描/连接/断开、Reader 的读取）。代价是任何没被下层捕获的异常会直接冒到 WinForms 全局未处理异常对话框，能否继续取决于用户点『继续』还是『退出』。"}],"designer":[{"a":1,"b":4,"title":"命名空间与 partial class：为什么全文一行 using 都没有","brief":"用完全限定名写类型所以不需要 using；只写 partial class Form1，基类交给 Form1.cs 那半边","detail":"这四行定下全文写法：namespace 把 Form1 关进 ABB_Digital_Twin；class 前写 partial，表示这里只是 Form1 的一半，另一半在同目录 Form1.cs 里。这里故意不写「: Form」——两半合成一个类，基类只需一处声明，设计师把这处留给手写那半，避免改一处漏一处。全文没有一行 using，是因为设计器一律用完全限定名：好处是永不与同名类型冲突，代价是啰嗦。↔ 与 Form1.cs 第 14 行的 partial class Form1 : Form 配对读。","gotcha":"Designer.cs 里的 using 会在设计器重新生成时被清掉，别在这半边加。"},{"a":5,"b":9,"title":"components 字段：所有组件的统一释放登记处","brief":"IContainer 容器字段，初值 null，登记进去的组件由它一次性释放","detail":"三行三斜线注释加一行字段声明。components 是 IContainer 类型的字段，初值 null，它就是设计师的释放登记处：任何 IComponent（右键菜单、Timer 等）登记进去，窗体释放时一句 components.Dispose() 全部带走，不必逐个写 Dispose。名字 components 是硬约定，别改；这里只声明不创建，真正 new 在第 31 行。↔ 下游第 57~59 行把 this.components 传进右键菜单构造；Dispose 第 16 行判空、第 18 行调用它。","gotcha":"手工 new 的组件（如 Form1.cs 第 18 行的 poseTimer）不登记就不受它管。"},{"a":10,"b":22,"title":"Dispose(bool)：VS 标准的三步释放模板","brief":"判条件 → 释放登记组件 → base.Dispose 收尾，三步缺一不可","detail":"这是 VS 标准的释放模板，方法体只有三步：判条件（disposing 为真且 components 非空）→ components.Dispose() → base.Dispose(disposing)。disposing 为 false 是终结器路径，那时碰托管对象会出问题，所以条件里必须带它；判空防窗体没建成。最后那句不能省，漏了控件句柄不销毁，反复开关会泄漏句柄。↔ 与 Form1.cs 第 95~103 行 Form1_FormClosing 是两条互补路径：那边停定时器、断控制器连接，这边只管 UI 组件。","gotcha":"模板只释放登记过的组件；没登记的托管资源得自己在 FormClosing 里清。"},{"a":23,"b":30,"title":"#region 与 InitializeComponent 签名","brief":"折叠区标记 + 无参无返回的 InitializeComponent，注释明确警告不要手改","detail":"#region 把整段设计器代码折成一栏；29 行声明 InitializeComponent，无参无返回。三斜线注释是设计师的原话：本方法由设计器支持、不要手改——窗体设计器一保存就整段重写，手写的内容会被覆盖，要改界面请回设计器拖控件。方法内部顺序固定：new 控件 → SuspendLayout → 逐个设属性 → Controls.Add → ResumeLayout。↔ 调用方是 Form1.cs 第 21 行构造函数里的 InitializeComponent()，一 new 窗体控件就都建好、接好事件。","gotcha":"手写逻辑必须放进构造函数或 Load 事件，写进这里下次保存即被覆盖。"},{"a":31,"b":32,"title":"组件容器实例与资源管理器","brief":"new Container() 赋给 components；另建 ComponentResourceManager 供后半段取图标","detail":"第 31 行把 components 从 null 变成 Container 实例，这是后面右键菜单能登记、Dispose 能工作的前提。第 32 行建 ComponentResourceManager(typeof(Form1))，职责是按名字从 Form1.resx 取对象；本任务范围内它一次都没被用到（设图标那句在文件末尾），设计师照模板总会生成，手删了那句就编译不过。它不是 IComponent，所以不进 components。↔ 上游是第 8 行的字段声明，下游是第 57~59 行的登记与末尾的图标设置。","gotcha":"resources 这 30 行里完全没用到，看似死代码，删了会让末尾设图标那行报错。"},{"a":33,"b":62,"title":"30 个控件的 new：构造顺序不是显示顺序","brief":"只负责建对象，属性还是默认值；顺序是拖控件顺序，与屏幕位置无关","detail":"这 30 行只做一件事：new 出每个控件并赋给同名字段。此时它们还没上窗体（Controls.Add 在文件末尾），属性都是默认值，配置在后面每个控件各自的注释段里。顺序很乱：txtJ4 在 txtJ3 之前、label3 的文本却是 J4——只是拖控件的先后，与屏幕位置无关；位置看 Location，层级看 Controls.Add 的先后。第 57~59 行把 this.components 传进右键菜单，这是它们随窗体释放的唯一原因。↔ 下游接 378~407 行字段声明与末尾 Controls.Add。","gotcha":"三个 ContextMenuStrip 没被任何控件的 ContextMenuStrip 属性引用，是空菜单残留。"},{"a":63,"b":64,"title":"SuspendLayout：冻结布局换性能与不闪","brief":"先冻结子控件 menuStrip2、再冻结窗体，避免每改一个属性就重排重绘","detail":"这两行是性能与不闪的关键闸门。SuspendLayout() 一旦挂上，冻结期间设 Location/Size 只改字段，不立刻触发父容器重排重绘；否则 30 个控件、上百次赋值每次都让窗体算一遍坐标，既慢又闪。顺序上先冻结子控件 menuStrip2、再冻结窗体，恢复时正好反过来。冻结几次就要恢复几次。↔ 严格配对的是文件末尾的 ResumeLayout()/PerformLayout()，漏配对控件会全挤在左上角。","gotcha":"SuspendLayout 与 ResumeLayout 必须成对；只冻结不恢复，窗体显示时布局是残缺的。"},{"a":65,"b":76,"title":"button1「扫描控制器」：位置、字体、事件接线","brief":"左下角绝对定位 (12,219)、165×52、Tab 序第 0，Click 接 button1_Click","detail":"三行分隔注释加 8 行属性：把「扫描控制器」按钮钉死在左下 (12,219)、165×52、字体微软雅黑 9 点、Tab 序 0，最后一行把 Click 接到 button1_Click。绝对定位意味着窗体缩放时它不跟着动（没有 Anchor/Dock）。点下去先清空 listBox1，再调 ScanControllers 扫描局域网控制器，把结果逐行塞进 Items。↔ 处理方法是 Form1.cs 第 54 行 button1_Click；扫描是同步阻塞的，会卡界面数秒。","gotcha":"y=219 与 button2 的 216 差 3 像素，界面上看得出歪。"},{"a":77,"b":88,"title":"listBox1：只占左侧的控制器列表","brief":"FormattingEnabled + ItemHeight=20 + (12,84) 382×124，只够 6 行，多了要滚动","detail":"这个 ListBox 只设了字体、FormattingEnabled、ItemHeight=20、位置 (12,84)、尺寸 382×124、Tab 序 1；没设 SelectionMode（默认单选）、没设多列、也没设 Text——内容只能靠 Items 集合加。382 的宽说明它只占左侧，右边留给关节角区；124 高除 20 只够 6 行，扫描到第 7 台就出滚动条。↔ 数据来自 button1_Click 里的 listBox1.Items.Add(line)。","gotcha":"124 不是 20 的整数倍，IntegralHeight 默认 true，实际高度可能被吸附成 120（未验证）。"},{"a":89,"b":100,"title":"button2「连接控制器」：与 button1 不成对的对齐","brief":"(229,216)、165×52、Tab 序 2，Click 接 button2_Click","detail":"同样 8 行属性：位置 (229,216)、165×52、「连接控制器」、Tab 序 2、Click 接 button2_Click。两个按钮本应并排成一条线，实际 x=229 减掉 button1 右边缘（12+165=177）还空出 52 像素，y=216 又比 219 高 3 像素——一处水平留白、一处垂直错位，都是手拖留下的。↔ 处理方法在 Form1.cs 第 75 行：没扫过就先扫，再 ConnectFirstController 连第一台并弹框。","gotcha":"ConnectFirstController 写死只连第一台，界面没提供选择列表。"},{"a":101,"b":112,"title":"button3「读取六轴姿态」：页面上唯一的手动读取入口","brief":"(623,37)、164×52、Tab 序 3，Click 接 button3_Click","detail":"把「读取六轴姿态」按钮放在 (623,37)、164×52，Tab 序 3，Click 接 button3_Click。它不在下方按钮行，而跑到窗体右上方、六个输入框之上，是唯一「手动读一次」的入口；宽度 164 比前面按钮少 1 像素，说明不是拖出来的副本。↔ button3_Click（Form1.cs 第 105 行）只有一行 UpdateRobotPoseDisplay(true)，读一次并写进 txtJ1~txtJ6，失败弹框。","gotcha":"失败提示只给 ex.Message，真正原因在 InnerException 里看不到。"},{"a":113,"b":128,"title":"第一行：label1「J1 :」与 txtJ1","brief":"AutoSize 标签在 (642,164)，文本框在 (690,160) 67×27","detail":"六行显示区的第一行：label1 是 AutoSize 的「J1 :」，Size(32,20) 只是设计器按文字算出的记录值、运行时会自己撑开；txtJ1 在 (690,160)、67×27。x 从 642 到 690 差约 48 像素，就是标签与数值框之间那道白；标签 y 比框高 4 像素，让文字视觉上与数字齐平。这一行都没写 Font，所以继承窗体的字体。↔ 值来自 Form1.cs 第 149 行 txtJ1.Text = poseData.J1.ToString(\"F2\")。","gotcha":"六个 txtJ* 都没设 ReadOnly，界面数值可被手动改写，与控制器真实状态不一致却无提示。"},{"a":129,"b":144,"title":"第二行：txtJ2 与 label2「J2 :」","brief":"文本框 (690,193)，标签 AutoSize 在 (641,196)；y 相差 33 正好一行","detail":"第二行先出框后出标签，是拖控件的顺序：txtJ2 的 TabIndex=7、label2 是 6，Tab 键仍先停标签。y 从 160 到 193 差 33，配 27 的框高约留 6 像素行间；label2 的 x=641 比 label1 的 642 少 1 像素，是手拖抖动，肉眼看不出。↔ 与第一行同源：UpdateRobotPoseDisplay 里 txtJ2.Text = poseData.J2.ToString(\"F2\")。","gotcha":"67 像素宽只容得下约七字符，角度到 -1234.56 这类数值会显示不全。"},{"a":145,"b":160,"title":"第四行先出场：txtJ4 与 label3「J4 :」","brief":"命名陷阱：变量叫 label3，文本却是「J4 :」；位置 y=261/264 确实是第四行","detail":"这块有个最容易误读的命名陷阱：label3 的 Text 是「J4 :」——变量编号 3，内容却是第 4 轴。原因是先拖了这一对、后拖 J3 那一对，设计师按创建顺序发编号；位置却对得上内容：txtJ4 在 y=261、label3 在 y=264，正是自上而下第四行。↔ 这一行装 poseData.J4，由 UpdateRobotPoseDisplay（Form1.cs 第 152 行）写入。","gotcha":"读这份文件不能靠变量名猜轴号，要看 Text 和 y，否则 J3/J4 两行必混。"},{"a":161,"b":176,"title":"第三行补位：txtJ3 与 label4「J3 :」","brief":"文本框 (690,228)，标签在 (642,232)；它与上一行差 35，比别处多 2 像素","detail":"对称的另一半：label4 的 Text 是「J3 :」，txtJ3 在 (690,228)、label4 在 (642,232)，是自上而下第三行。y 从上一行 193 到 228 差 35，比其它行的 33 多 2 像素——六行并非严格等距，第三行往下压了一点。TabIndex 8/9 让 Tab 顺序仍是 J1→J2→J3→J4，因为 TabIndex 按创建顺序发，恰好与视觉顺序一致。↔ poseData.J3 由 UpdateRobotPoseDisplay 写入。","gotcha":"Tab 顺序与视觉顺序一致只是巧合，新增控件后必须回设计器重排 TabIndex。"},{"a":177,"b":192,"title":"第六行先出场：txtJ6 与 label5「J6 :」","brief":"文本框 (690,327) 是最低一行，配它的 label5 文本却是「J6 :」","detail":"又是命名错位：txtJ6 在 (690,327)，是六行里最低的一行，配它的标签却叫 label5、文本「J6 :」，位置 (641,330)。label 的 y 一贯比对应文本框多 3~4 像素，是让标签文字与框内数字视觉齐平。TabIndex 14/15 也是所有显示控件里最大的两个。↔ 这里是 poseData.J6 的落点，由 UpdateRobotPoseDisplay（Form1.cs 第 154 行）写入。","gotcha":"六行显示区里 label5/label6 与 txtJ5/txtJ6 的编号是交叉的，只认 Text 与 y。"},{"a":193,"b":208,"title":"第五行收尾：txtJ5 与 label6「J5 :」","brief":"文本框 (690,294)，label6 的文本是「J5 :」；六行显示区到本块结束","detail":"补上第五行：txtJ5 在 (690,294)、label6 的 Text 是「J5 :」在 (642,298)，Tab 序 12/13。六行看完得出规律：label1=J1、label2=J2、label4=J3、label3=J4、label6=J5、label5=J6，而屏幕顺序始终是 J1→J6 自上而下——位置对、名字乱。208 行是 label7 那一段的分隔注释。↔ 之后（209 行起）是六个「度」单位标签与实时读取按钮，归另一位同事。","gotcha":"到本块结束，六个数值框都还没有单位标签，单位「度」由 209 行以后的 label7~label12 补上。"},{"a":209,"b":217,"title":"label7：第一个「度」字单位标签","brief":"给 J1 的文本框右侧摆一个只显示「度」的标签","detail":"定义六个单位标签的第一个。AutoSize=true 让宽度随「度」字收缩，Location=(763,164) 贴在 txtJ1 右侧（文本框右边缘 690+67=757，留 6 像素）。↔ 数据来自 Form1.cs 的 UpdateRobotPoseDisplay：那里只把 poseData.J1 用 ToString(「F2」) 写进框内，单位写不进去。坑：TextBox 没有「后缀」属性，要在框内显示「90.00 度」得拼字符串、污染可编辑文本，故用独立 Label，代价是手写坐标。","api":"Label.AutoSize（System.Windows.Forms.Label）","gotcha":"单位标签靠手写坐标对位，字体或 DPI 一变就错开"},{"a":218,"b":262,"title":"label8~label12：另外五个「度」字标签","brief":"同一套属性的复制粘贴，只改 Name、Location、TabIndex","detail":"这五块是 label8~label12，属性照抄 label7（AutoSize、尺寸、文字都相同），只改 Name、Location、TabIndex：x 全是 763 排一列，y 依次 196/231/264/298/330，TabIndex 连号 17~21。y 比 txtJ2~txtJ6 各低 3~4 像素——文本框高 27、标签高 20，下移半个差值求视觉居中。↔ 共同服务 UpdateRobotPoseDisplay 的六行赋值。坑：无容器兜底，缩放或换字体会错位。","gotcha":"六个标签各写一遍坐标，改布局得改六处"},{"a":263,"b":274,"title":"btnStartRealTime：开始实时读取按钮","brief":"164×52 的按钮 (559,101)，点一下启动 500ms 定时器","detail":"定义「开始实时读取」按钮：Font 显式设为 9pt 微软雅黑（与窗体级相同，属冗余），Location=(559,101)、Size=164×52，是第二排靠左那个，TabIndex=22 排在标签文本框之后，属后追加。273 行把 Click 接到 btnStartRealTime_Click：先手动读一次，成功才 poseTimer.Start() 并弹框。↔ 上游是构造函数里 Interval=500 的定时器，下游是 PoseTimer_Tick。它不判断是否已运行，连点只重复 Start。","api":"Button.Click += EventHandler（Form1.btnStartRealTime_Click）"},{"a":275,"b":286,"title":"btnStopRealTime：停止实时读取按钮","brief":"与开始按钮同尺寸，(729,101)，中间只隔 6 像素","detail":"定义「停止实时读取」按钮，结构照抄左边：9pt 雅黑、164×52、UseVisualStyleBackColor=true。位置 (729,101) 紧接 btnStartRealTime：559+164=723，729-723=6，只隔 6 像素，像一对孪生按钮，但宽度都是 164，没贴成一条长条。↔ 285 行接 btnStopRealTime_Click，方法体只有 Stop() 加一句 MessageBox。坑：GetPosition 卡在网络往返时消息循环被占，点它要等读取返回才响应。","api":"Button.Click += EventHandler（Form1.btnStopRealTime_Click）"},{"a":287,"b":304,"title":"contextMenuStrip1/2/3：三个空的右键菜单","brief":"Size 高度只有 4，一个菜单项都没有，也没人引用","detail":"连续定义三个右键菜单，每个只设三样：ImageScalingSize=20×20（菜单项图标缩放尺寸，本程序没图标，纯默认值）、Name、Size=(61,4)。高度 4 是关键证据：每多一个 ToolStripItem 高度就加二十几像素，4 说明门可罗雀，是空壳。↔ 全文件没有任何控件的 ContextMenuStrip 属性指向它们，右键也弹不出来；它们只在 57~59 行被塞进 components，Dispose 时顺带释放。坑：这是拖进来没配置的残留，删掉这三段和三条字段声明，功能零影响。","gotcha":"空 ContextMenuStrip 既无 Items、也无人绑定，永远不会显示"},{"a":305,"b":315,"title":"menuStrip2：窗体顶部那条菜单条","brief":"966×28 贴在 (0,0)，一次挂入唯一顶级菜单项","detail":"定义顶部菜单条 MenuStrip：ImageScalingSize=20×20（图标缩放，未用图标故无效）；308~309 行用 Items.AddRange 一次挂成唯一顶级项；Location=(0,0) 钉在左上角；Size=966×28 与 ClientSize 同宽，28 是 9pt 字体行高加内边距；TabIndex=30 为全文最大。↔ 369~370 行还要单独 ResumeLayout，与 63 行的 SuspendLayout 配对。注：未写 Dock，靠控件默认 Dock=Top 停靠。","api":"MenuStrip.Items.AddRange(ToolStripItem[])"},{"a":316,"b":324,"title":"toolStripMenuItem2：标题为「12231」的顶级菜单项","brief":"测试数字当菜单名，还挂了个空的 Click 处理方法","detail":"菜单条上唯一的顶级项：318~319 行用 DropDownItems.AddRange 挂入子项 toolStripMenuItem4；Size=68×24 里 68 是「12231」五个字符的量测宽度，24 是菜单行高；323 行把 Click 接到 toolStripMenuItem2_Click。Text=「12231」毫无业务含义，是随手敲的测试字符。↔ 那个 Click 是空方法（Form1.cs 里 toolStripLabel1_Click 也空）。坑：用户看到菜单写着五个数字，会以为程序没做完。"},{"a":325,"b":330,"title":"toolStripMenuItem4：下拉里唯一的子项「12121」","brief":"224×26 的菜单行，没有 Click 订阅，点了无反应","detail":"定义 toolStripMenuItem4，它是 toolStripMenuItem2 下拉里唯一的子项，也是菜单链末端。只有三个属性：Name、Size=224×26、Text=「12121」。224 是下拉菜单预留宽度（总比文字宽，方便以后加长项），26 是标准菜单行高；它没订阅 Click，点了什么都不会发生。↔ 两级 AddRange 才让它上屏：319 行挂到父项，父项又在 309 行挂进 menuStrip2.Items。坑：编号从 2 跳到 4，中途删过一项。"},{"a":331,"b":335,"title":"窗体自身属性：AutoScale、AutoScaleMode、ClientSize","brief":"以 9pt 雅黑一行 20px 为设计基准，客户区 966×569","detail":"从这行起不再设子控件，改设 Form1 自己。AutoScaleDimensions=(9F,20F) 记录设计时的字体度量：9pt 微软雅黑一行约 20 像素；AutoScaleMode=Font 让运行时用当前字体度量除以设计值得到缩放系数，再乘到每个子控件的 Location 与 Size 上。ClientSize=966×569 是客户区（不含标题栏）大小。↔ 它也解释了上文 Margin/Padding 垂直值为何取 4：按 20 像素字高算的。坑：六个「度」标签手写坐标，换缩放仍可能错位。","api":"Form.AutoScaleDimensions / Form.AutoScaleMode / Form.ClientSize"},{"a":336,"b":360,"title":"25 次 Controls.Add：Z 序是从后往前叠的","brief":"先加停止按钮，最后加 menuStrip2，后者位于最底层","detail":"336~360 行按「倒序」把 25 个控件挂到窗体上。WinForms 里 Controls.Add 追加到集合末尾，末尾的控件先绘制、位于 Z 序最底层；所以这段反着写的顺序，实际得到 menuStrip2 在最底、btnStopRealTime 在最上。25 个控件坐标互不重叠，层序看不出来。↔ 它们正是 33~62 行 new 出来的那批（30 个 new 减 2 个菜单项、3 个右键菜单）。坑：哪天 listBox1 放大压住按钮，才需改顺序或 BringToFront。","api":"Control.ControlCollection.Add(Control)","gotcha":"Add 顺序 = 从上层到下层，最后 Add 的位于最底"},{"a":361,"b":364,"title":"窗体字体、图标、外边距与名字","brief":"9pt 雅黑作窗体级字体，子控件不设即继承","detail":"361 行设窗体级 Font 为 9pt 微软雅黑、单位 Point，参数 134 是字符集 GB2312_CHARSET；子控件不设 Font 就继承它，txtJ1~txtJ6 都没设，所以显示的就是它。362 行 Icon 从 Form1.resx 二进制资源取：resources 是第 32 行 new 的 ComponentResourceManager，$this.Icon 是键名。363 行 Margin 对顶层窗体无视觉效果。364 行 Name 让 typeof(Form1) 对上资源名。"},{"a":365,"b":366,"title":"StartPosition 与标题栏文字","brief":"启动居中，标题写「喷涂机械臂数字孪生系统」","detail":"365 行 StartPosition=CenterScreen 让窗口首次显示时出现在屏幕正中（多屏按主屏算），而不是系统默认的位置算法。366 行 Text 是标题栏文字「喷涂机械臂数字孪生系统」。↔ 这条标题是判断程序定位的关键证据：全程序只有 Form1 界面加 PCSDK 读关节角，没有任何 3D 模型或场景渲染代码，「数字孪生」只停留在名字上，真正干活的仍是 Form1.cs 的 UpdateRobotPoseDisplay。坑：Text 同时是可访问性名称，读屏软件与 UI 自动化读到的就是这串字。"},{"a":367,"b":368,"title":"FormClosing 与 Load 事件订阅","brief":"关窗时停定时器断连接，但 FormClosing 被订阅了两次","detail":"367 行把窗体关闭事件接到 Form1.cs 的 Form1_FormClosing：先 poseTimer.Stop() 再 DisconnectController()，防止关窗后定时器还在读、连接没释放。368 行 Load 接 Form1_Load，而该方法是空的。↔ 这两行是设计器里仅有的窗体级事件接线。坑（重点）：Form1.cs 构造函数第 32 行又订阅了一次 FormClosing，同一处理者挂两遍，多播使关窗时方法连跑两遍；Stop 与 Disconnect 幂等所以无害，但应只留一处。","api":"Form.FormClosing += FormClosingEventHandler / Form.Load += EventHandler","gotcha":"FormClosing 被订阅两次，关闭窗口时处理方法跑两遍"},{"a":369,"b":376,"title":"ResumeLayout 收尾与 #endregion","brief":"恢复布局、真正排一次版，然后结束设计器生成区","detail":"369~370 先恢复 menuStrip2 布局：MenuStrip 是复合控件，内部还有 ToolStripItem 布局链，63 行 SuspendLayout 过，必须配对 ResumeLayout(false) 再 PerformLayout()。371~372 行是整个窗体收尾：恢复绘制并立刻按最终尺寸重算位置，避免控件先画错再跳一下。374 行闭合 InitializeComponent，376 行 #endregion。↔ 与 63~64 行两个 SuspendLayout 配对，少一侧布局不更新。","api":"Control.SuspendLayout / ResumeLayout / PerformLayout"},{"a":377,"b":409,"title":"#endregion 之后的 30 条字段声明","brief":"全部 private、无初始化，是界面控件的引用清单","detail":"378~407 行是 30 个控件字段声明，全部 private、无 static、不 new 也无初值，只占一个引用。放在 #endregion 之后是设计器惯例：上面 #region 是会被重新生成的属性赋值方法，下面是字段清单，改界面时只重写方法体。它们与 33~62 行 new 出来的是同一批对象。↔ 声明顺序与 new 顺序一致，但与界面逻辑顺序 J1…J6 不同（txtJ4 在 txtJ3 前），无害。408 行闭合 partial class Form1，409 行闭合命名空间。"}]},"lines":{"program":{"1":"引入 System 基础命名空间；[STAThread] 这个特性就来自它，本行确实在用","2":"引入集合命名空间，本文件一个泛型集合都没用，是 VS 模板自带的冗余行","3":"引入 LINQ，本文件没有任何查询或扩展方法调用，同样用不到","4":"引入 Task 异步命名空间，本文件是纯同步代码，这行也没用","5":"引入 WinForms 命名空间；Application、Form1 都靠它，是本文件必需的一行","6":"","7":"声明命名空间，把程序集里的类型都归到 ABB_Digital_Twin 这个名字下","8":"命名空间左括号，从这到第 22 行都属于 ABB_Digital_Twin","9":["声明程序入口类；internal 只对本程序集可见，static 表示不能 new 出实例","为什么必须 static：Main 是运行时按名字在类型上查找的入口，不属于任何对象，只能是静态方法。标 internal 就够了，编出来的 exe 不需要把它暴露给别的程序集。static 类里所有成员也必须是静态的，这也是第 15 行 Main 必须写 static 的另一层原因"],"10":"类体左括号，里面只装一个 Main 方法","11":"XML 文档注释开始，写给编译器与 IntelliSense 看的说明块","12":"文档注释的内容：这是应用程序的主入口点","13":"文档注释结束，收了上面两行的说明块","14":["标记 Main 运行在单线程单元（STA）里，这是 WinForms 的硬性要求","STA 的意思是一次只允许一个线程访问该单元内的 COM 对象。剪贴板、拖放、部分 ActiveX 控件（还有后面会用的 MessageBox、文件对话框）都要求调用线程处于 STA。CLR 在进入 Main 之前读取这个特性并设置线程的单元状态，所以它是「看着像注释、实际影响运行」的典型"],"15":"Main 的签名：static 无参、返回 void，这就是标准入口形式之一","16":"方法体左括号，程序运行时从这里开始执行","17":["打开 Windows 视觉样式，让按钮、输入框按当前系统主题绘制","不调这句控件会退回 Win95 风格的灰色方框。它必须在创建任何窗口之前调用，否则第一个窗体已经按旧样式画好了"],"18":["把控件默认文本渲染设为 GDI（false 是推荐值），而不是 GDI+","true 会用 GDI+ 画文字，字距与大小跟 .NET 1.x 兼容；false 用 GDI，与现代 Win32 程序一致、更清晰。这行同样必须在创建第一个窗口之前调用，而且一个进程只能设一次"],"19":["创建 Form1 并启动消息循环；程序会一直阻塞在这里，直到主窗体关闭","Run 内部就是经典的取消息、翻译、分发循环：没有它，窗体一显示就立刻消失。它返回之后 Main 才继续往下走——本例 Main 后面没有代码，所以 Run 返回即进程结束"],"20":"方法体右括号，闭合 Main","21":"类体右括号，闭合 Program 类","22":"命名空间右括号，闭合 ABB_Digital_Twin"},"class1":{"1":"引入 System 基础命名空间；这个类是空的，用不到其中任何类型","2":"集合命名空间，同样没用；VS 新建类时模板固定带这 5 行","3":"LINQ 命名空间，本文件没有任何查询，纯冗余","4":"System.Text 命名空间，模板默认带，这里没用到 StringBuilder 之类","5":"Task 异步命名空间，纯冗余","6":"","7":"命名空间声明，与 Program.cs、Form1.cs 共用同一个 ABB_Digital_Twin","8":"命名空间左括号，第 12 行闭合它","9":["声明一个 internal 的空类 Class1，没有任何字段、方法或构造函数","internal 表示只在本程序集可见；类名 Class1 是 VS 新建类时的默认名，说明这个文件从创建起就没被改过内容。它仍会被编进 exe 的程序集元数据（多一个类型条目），但因为没有字段也没有静态构造函数，运行时几乎不产生开销"],"10":"类体左括号，里面什么都没有","11":"类体右括号，闭合 Class1——这个类从头到尾是空的","12":"命名空间右括号，闭合 ABB_Digital_Twin"},"pose":{"1":"引入 System 基础命名空间；模板自带，本文件并不直接用到其中类型","2":"集合命名空间，模板自带；本类只有 14 个自动属性，没有集合","3":"LINQ 命名空间，模板自带，本文件没有查询语句","4":"System.Text 命名空间，模板自带，本文件没有字符串处理工具","5":"Task 异步命名空间，模板自带，纯数据类没有异步代码","6":"","7":"命名空间声明，与 Form1、Reader、Program 同属 ABB_Digital_Twin","8":"命名空间左括号，第 29 行闭合它","9":["声明 public 的数据传输类，纯数据、没有任何方法","public 而不是 internal：它要作为 out 参数的类型在 Reader 与 Form1 之间传递，同程序集内 internal 也够用，但 DTO 的定位是对外暴露的数据契约，写 public 更合惯例，将来把数据层拆成独立类库也不用改"],"10":"类体左括号，下面 14 个自动属性都装在这里","11":["自动属性 J1：编译器在后台替你生成一个私有字段加一对 get/set","写 get; set; 时编译器自动生成隐藏的后备字段（名字在源码里不可见），get 返回它、set 写它；对外是属性、对内仍是字段，调试器和序列化框架都认得。若写 get; private set;，外部只能读、只有本类能写，适合只由内部逻辑决定的值；若写 get; 并在构造函数里赋值，才是真正只读（C# 6 起）。本类 14 个属性全是公开可读可写的哑属性，任何引用方都能改"],"12":"自动属性 J2，第 2 轴关节角，double 容器装 PCSDK 的 float 值","13":"自动属性 J3，第 3 轴关节角","14":"自动属性 J4，第 4 轴关节角","15":"自动属性 J5，第 5 轴关节角","16":"自动属性 J6，第 6 轴关节角；Form1 用两位小数显示这六个值","17":"","18":"自动属性 TcpX，TCP 在世界坐标系下的 X 坐标，单位 mm","19":"自动属性 TcpY，TCP 的 Y 坐标，单位 mm","20":"自动属性 TcpZ，TCP 的 Z 坐标；这三个值从未被任何代码读取","21":"","22":["自动属性 Q1，四元数的标量部分 w，不是 x 分量","PCSDK 的 Orient 内部字段是 _q1.._q4，其中 Q1 对应 w、Q2/Q3/Q4 对应 x/y/z。这与 .NET System.Numerics.Quaternion(x,y,z,w) 的构造顺序相反，直接按 Q1,Q2,Q3,Q4 的顺序去构造会得到错误姿态（换成其它数学库时的具体表现未验证）"],"23":"自动属性 Q2，四元数向量部分的 x 分量","24":"自动属性 Q3，四元数向量部分的 y 分量；同样只赋值不读取","25":"自动属性 Q4，四元数向量部分的 z 分量","26":"","27":["自动属性 MechanicalUnitName，当前活动机械单元的名字","string 是引用类型，未赋值时默认就是 null，不像 double 会自动变成 0.0；本类每次读取都 new 一个新对象再由 Reader 立即赋值，实际不会为 null，但类型上允许，读之前判空更稳"],"28":"类体右括号，闭合 AbbRobotPoseData，14 个属性到此结束","29":"命名空间右括号，闭合 ABB_Digital_Twin"},"reader":{"1":"引入 System 命名空间，Exception、String 这些基础类型就不用写全名","2":"引入泛型集合命名空间，本文件其实没有用到 List 或 Dictionary","3":"引入 LINQ，本文件同样没用到，是新建类时的模板残留","4":"引入 System.Text，处理字符串编码用，本文件未直接使用","5":"引入 Task 相关命名空间，异步编程用，本文件未用到","6":"引入 PCSDK 核心域，Controller 这个最重要的类型就住在这里","7":"引入运动域，MechanicalUnit、JointTarget 等类型都在这里","8":"引入 RAPID 域，RobJoint、RobTarget、Orient 都归它管","9":"","10":"命名空间声明，本程序所有类都装在 ABB_Digital_Twin 这个筐里","11":"命名空间左括号，里面的类型对外全名是 ABB_Digital_Twin 加类名","12":"公开类 AbbRobotPoseReader，只干一件事：把控制器姿态读成纯数据","13":"类体左括号，往下到第 72 行都是这个类的成员","14":["公开方法：收一个已连接的 Controller，吐出姿态数据和一句提示语","三个细节：controller 是输入；poseData 与 message 是 out，被调方必须在每条返回路径上先赋值，调用方反而可以传未初始化的变量；返回 bool 而不抛异常，是因为\"没连接\"\"没激活单元\"这类读取失败属于预期内常态，不想让 UI 层到处写 try/catch。"],"15":"方法体左括号","16":["先把 out 参数置 null，满足编译器\"返回前必须赋值\"的要求","out 与 ref 的区别就在这里：编译器要求方法在 return 之前给两个 out 参数各赋值一次，漏一条路径就编译不过。先置 null 还有语义作用：任何一条失败路径返回后调用方拿到的 poseData 一定是 null，不会残留旧引用；Form1 里 poseData 是未初始化的局部变量，若这行不赋值，后面根本读不了。"],"17":"把提示语清空成空串，失败时调用方拿到的就是干净的空字符串","18":"","19":"开始 try 块，把下面所有 PCSDK 调用都圈进异常保护区","20":"try 块左括号","21":"先查控制器是否为空，防止用户没连接就点读取导致空引用崩溃","22":"if 块左括号","23":"给一句人能看懂的失败原因，稍后会由调用方弹到 MessageBox 上","24":"提前返回 false；注意此时 poseData 仍是第 16 行给的 null","25":"闭合第 21 行的 if 块","26":"","27":"注释：说明下一行取的是\"当前激活\"的那一个机械单元","28":["向运动系统要当前激活的机械单元，一次控制器往返就发生在这行","PCSDK 里 MotionSystem 有两个入口：ActiveMechanicalUnit 只返回控制器上当前激活的那一台（RobotStudio 里选中谁就是谁），带外轴或双机系统时其它机械单元它完全看不到，要遍历得用 MechanicalUnits 集合，本程序没写。反编译显示这个属性每次都读一次 InternalController.Motion.ActiveMech 做缓存比对，所以每访问一次都可能触发一次控制器往返，不适合放在高频循环里反复问。"],"29":"","30":"再查一次 null：控制器在线但没有激活机械单元时会返回 null","31":"if 块左括号","32":"提示没有活动机械单元，通常是控制器还在启动或没加载系统","33":"返回 false，poseData 依旧保持 null","34":"闭合第 30 行的 if 块","35":"","36":"注释：接下来读六个关节轴的角度","37":["取回一个 JointTarget，里面同时装着机器人六轴和外轴的角度","反编译看无参版 GetPosition 是按单元类型分流的：类型为 TcpRobot 时把关节值塞进 RobAx、ExtAx 给 Empty；若是外轴或变位机（MultiAxes、SingleAxis），则反过来把值全塞进 ExtAx，RobAx 直接给 RobJoint.Empty 也就是全 0，而且不抛异常。所以这行在带外轴的站上会\"成功返回一堆 0\"。"],"38":["只取机器人本体那半边的关节角，外轴那半边 ExtAx 被直接丢掉","这就是上一行那个坑的落点：代码只认 RobAx，从不看 ExtAx，而第 37 行的分流逻辑恰恰可能在 RobAx 里放全 0。结果 J1~J6 静默显示 0.0000，readOk 却仍是 true，界面上没有任何错误提示，比\"读取失败\"难查得多。要补的话可以判断 ExtAx 是否非零，或在单元类型不是 TcpRobot 时直接给出提示。"],"39":"","40":"注释：下一行读笛卡尔位姿，World 表示世界坐标系","41":["取 TCP 在指定坐标系下的位姿，这里选择了世界坐标系","CoordinateSystemType 是 PCSDK 的坐标系枚举，常用的还有 Base 基座系、Tool 工具系、WorkObject 工件系等。这条重载底层走 Motion.GetCartesianPosition 这个 RPC，只对 TcpRobot 型单元有效，其它类型会返回错误并被包成异常抛出。因为它和第 37 行挤在同一个 try 里、且在后，一旦抛异常，明明已经读到的关节角也随整次调用一起被判失败。"],"42":"","43":"两次读取都成功了才创建 DTO，失败路径上不必浪费这次分配","44":"","45":"把单元名也存进 DTO，不过全程序没人读它，属于预留字段","46":"","47":"J1 赋值：Rax_1 是 float，赋给 double 属性会自动加宽不报错","48":"J2 同上；关节角单位是度，和示教器上看到的数字一致","49":"J3 同上，把 Rax_3 搬到 poseData.J3","50":"J4 同上","51":"J5 同上","52":"J6 同上；六轴写到这里结束，这是界面唯一真正用到的数据","53":"","54":"TCP 的 X，取自 RobTarget.Trans（Pos 结构），单位是毫米","55":"TCP 的 Y，同样来自 Trans，单位也是毫米","56":"TCP 的 Z，毫米；ABB 世界系里 Z 轴朝上，是右手系","57":"","58":["Q1 是四元数的标量部分 w，不是 x，顺序和 .NET 正好相反","ABB 的 Orient 把四个分量存成 _q1.._q4，其中 Q1 对应 w、Q2/Q3/Q4 对应 x/y/z；而 .NET System.Numerics.Quaternion 的构造函数顺序是 (x, y, z, w)。所以将来拿这四个数去构四元数必须写成 new Quaternion(Q2, Q3, Q4, Q1)，写反了姿态会整个错掉。另外 Orient 自带 ToEulerAngles(out x, out y, out z)，以后要显示欧拉角直接调它，不用自己推公式。"],"59":"Q2 是四元数的 x 分量，别把它当成第二个标量","60":"Q3 是四元数的 y 分量","61":"Q4 是四元数的 z 分量；四个数一起才确定一个完整姿态","62":"","63":"成功提示语；但调用方只在失败时弹窗，这条成功串目前没人显示","64":"返回 true，告诉调用方 poseData 有效、可以放心取字段了","65":"闭合第 19 行的 try 块","66":"兜住上面所有 PCSDK 调用可能抛出的异常，一口全部吃掉","67":"catch 块左括号","68":["失败提示只拼了 ex.Message，异常类型和内部异常全被丢掉","PCSDK 内部习惯把底层 RPC 异常再包一层（ExceptionManager.Create 带 ex.InnerException），所以这里拿到的 ex.Message 往往只剩一句外壳文字，真正的原因——HResult、服务端返回码、对方给的原话——全在 InnerException 里，被这行丢了。排查\"为什么连不上\"时通常要看 ex.ToString() 或把 InnerException 也拼进 message，才能看到上下文。"],"69":"返回 false；此时 poseData 一定是 null，调用方不能解引用","70":"闭合第 66 行的 catch 块","71":"闭合 ReadRobotPose 方法","72":"闭合 AbbRobotPoseReader 类","73":"","74":"闭合命名空间 ABB_Digital_Twin，文件到此结束"},"conn":{"1":"引入 System 命名空间，Exception、String 这些最常用的类型都在这里","2":"引入泛型集合命名空间，本文件要用的 List<T> 就定义在这里","3":"引入 LINQ 扩展方法命名空间；本文件其实没用到，是模板默认带来的","4":"引入文本与编码命名空间，StringBuilder 之类住在这里，本文件未使用","5":"引入异步任务命名空间，本文件没有任何 async 代码，属模板残留","6":"引入控制器根命名空间，Controller、ControllerFactory 都在这里","7":"引入发现命名空间，扫描用的 NetworkScanner 住在这里","8":"","9":"命名空间声明，本项目所有类都放在 ABB_Digital_Twin 下，互相调用不用写全名","10":"命名空间的左括号，从这里开始里面的名字都归 ABB_Digital_Twin 管","11":"设备层类，internal 表示只在本次编译出的程序集里可见；它只干扫描、连接、断开
